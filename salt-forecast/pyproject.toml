[project]
name = "salt-forecast"
version = "0.1.0"
description = "SALT 전망 · 데이터 파이프라인 (ADR-004)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "lightgbm>=4.7.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "respx>=0.21",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salt_forecast"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "SIM", "RUF"]
# DTZ: naive datetime 금지 (python-style.md §3)
# RUF001~003: 한국어 문서의 수식 기호(× − α)는 의도다
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: 실제 Postgres 가 필요하다 (FORECAST_DATABASE_URL)"]

# 레이어 규칙 — .claude/rules/architecture.md §1 과 같은 표다. 바꾸면 같이 바꾼다.
[tool.importlinter]
root_package = "salt_forecast"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain 은 I/O 를 모른다"
type = "forbidden"
source_modules = ["salt_forecast.domain"]
forbidden_modules = [
  "psycopg", "sqlalchemy", "httpx",
  "salt_forecast.store", "salt_forecast.ingest", "salt_forecast.features",
  "salt_forecast.models", "salt_forecast.scoring", "salt_forecast.jobs", "salt_forecast.ontology",
]

[[tool.importlinter.contracts]]
name = "층"
type = "layers"
layers = [
  "salt_forecast.jobs",
  "salt_forecast.models | salt_forecast.scoring | salt_forecast.ontology | salt_forecast.ingest",
  "salt_forecast.features",
  "salt_forecast.store",
  "salt_forecast.domain",
]

[[tool.importlinter.contracts]]
name = "같은 층끼리 import 하지 않는다 (models → features 만 허용 — 층 계약이 이미 허용)"
type = "independence"
modules = ["salt_forecast.ingest", "salt_forecast.ontology", "salt_forecast.scoring", "salt_forecast.models"]
