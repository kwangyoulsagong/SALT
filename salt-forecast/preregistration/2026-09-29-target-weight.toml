# 사전등록 — 확률 없는 목표 비중 안내 규칙의 과거 성적 (F010 슬라이스 5 · FC-REQ-012)
#
# 이 파일은 **결과를 보기 전에** 커밋한다. 커밋 시각 · 해시가 등록 증거다.
# 등록 뒤 규칙 · 지표 · 문구 조건을 바꾸려면 새 키(`target-weight@2`)로 새 파일을 만든다 — 덮어쓰지 않는다.
# `jobs/target_weight` 가 이 파일을 `forecast.preregistration` 에 한 번 쓰고, 같은 키에 다른 내용이면 실패한다.
#
# 이 등록은 **채택 판정이 아니다**(사용자 결정 2026-09-29). 안내 규칙은 계산기 자리이고, 결과는 좋든 나쁘든
# 화면의 3종 고지(근거 · 과거 성적 · 실패 사례)로 그대로 나간다. 등록하는 것은 (1) 규칙 (2) 지표 (3) 화면이
# 어떤 문장을 쓸 수 있는지의 조건(claims)이다 — 결과를 보고 유리한 문장만 고르지 못하게.

key = "target-weight@1"
registered = 2026-09-29

[question]
text = """
서버가 매일 보여 줄 '목표 비중' 규칙(역변동성 배분 × 목표 변동성 × 한 종목 상한, 방향 판단 없음)을
이 시장(업비트 원화 일봉)에서 매주 따랐다면
1. 최대 낙폭 · 수익 · 변동성이 BTC 보유와 비교해 어땠나
2. 같은 평균 비중을 고정으로 들고 있던 것보다 나았나(타이밍 몫이 있나)
3. 실현 변동성이 목표 근처였나
4. 가장 크게 놓친 상승 · 가장 크게 잃은 달은 언제였나(실패 사례)
"""

[protocol]
source = "업비트 원화 일봉 forecast.price_bar(upbit, 1d). 봉 경계 = UTC 자정(KST 09:00)"
period = "2018-01-01 ~ 실행일 전날. ETH 원화 일봉 · σ 워밍업(관측 20개)이 둘 다 되는 첫날부터"
sigma = "종목 σ = EWMA(λ 0.94) 일 로그수익 σ × √365, t 종가까지(labels.ewma_sigma). 서버는 v_realized_vol.ewma 를 같은 값으로 읽는다"
cadence = "매주 월요일 00:00 UTC 에 마감한 봉 t 로 목표를 계산하고 t+1 수익부터 적용한다(하루 늦게 행동). 주 사이에는 비중이 가격대로 흘러간다"
cost = "리밸런스 날 Σ|목표 − 흘러간 비중| × 0.05%(편도) 차감"
cash = "남는 비중은 현금, 수익 0(예금 이자 없음 — 전략에 불리한 쪽)"
returns = "일 단순수익, 전략 일수익 = Σ 비중[t−1] × 종목 일 단순수익 − 비용, 로그로 누적"

[rule]
# 서버 domain/policy/targetWeight.ts 가 같은 식이다. 바뀌면 새 키
universe = "안내 대상 종목(서버: 보유 종목 ∪ {BTC, ETH}). σ 가 없는 종목은 빠진다"
inverse_vol = "s_i = (1/σ_i) / Σ_j (1/σ_j)"
sleeve_sigma = "σ_묶음 = Σ s_i σ_i — 상관 1 가정(상한). 실제 상관이 1 보다 작으면 실현 σ 가 목표보다 낮게 나온다"
exposure = "E = min(1, σ_target / σ_묶음)"
weight = "w_i = min(E × s_i, 한 종목 상한). 상한에 잘린 몫은 다른 종목에 다시 나누지 않고 현금으로 둔다"
cap = 0.6
targets = [0.10, 0.15, 0.20, 0.30, 0.50]

[universes]
core = "KRW-BTC · KRW-ETH — 1차 기록. 화면 고지는 이 묶음 값을 쓴다"
core_alts = """
core + 알트 10개: 리밸런스 날 t 기준 상장 60일 이상 · 최근 30일 원화 거래대금(종가 × 거래량 합) 상위 10(BTC · ETH 제외).
지금 상장 종목만 있다(생존 편향 — 리포트에 적는다). 기록만, 화면 고지에 쓰지 않는다
"""

[baselines]
hold_btc = "BTC 100% 보유"
hold_universe = "같은 묶음 동일가중 100%, 매주 리밸런스(같은 비용)"
constant = "같은 묶음 · 종목별 비중 = 전략의 기간 평균 비중으로 고정, 매주 리밸런스(같은 비용). 타이밍 몫을 가르는 기준"

[metrics]
mdd = "로그 누적 곡선의 최대 낙폭(양수 크기, 단순 비율로 표시)"
cagr = "연 365일 환산"
vol = "일 로그수익 σ × √365"
calmar = "CAGR / MDD"
upside_capture = "BTC 보유 월 로그수익이 양(+)인 달들의 전략 월 로그수익 합 / BTC 보유 합"
downside_capture = "음(−)인 달들에 대해 같은 식"
exposure_mean = "Σ w_i 의 일 평균"
delta_mdd_btc = "MDD_BTC보유 − MDD_전략. CI = 일 수익 쌍 이동 블록 부트스트랩, 블록 30일 · 2000회 · seed 20260929"
delta_calmar_constant = "Calmar_전략 − Calmar_고정. CI 같은 방식(세 곡선을 같은 인덱스로 뽑는다)"
failures = """
(a) 놓친 상승 3건: BTC 보유 월 로그수익이 양인 달 중 (BTC − 전략) 이 가장 큰 3개월
(b) 가장 크게 잃은 달 3건: 전략 월 단순수익 하위 3개월
각 건 = 달 · 전략 · BTC 보유 · 그달 평균 노출. 선별 없이 순서대로
"""

[claims]
# 화면이 쓸 수 있는 문장의 조건. core 묶음 · 사용자 목표 σ 에 가장 가까운 target 값으로 판정한다
less_drawdown = "delta_mdd_btc CI 하한 > 0 이면 'BTC 만 들고 있을 때보다 최대 낙폭이 작았어요'. 아니면 이 문장을 쓰지 않는다"
timing = """
delta_calmar_constant CI 하한 > 0 이면 '같은 비중을 고정으로 둔 것보다 나았어요'.
아니면 '같은 비중을 고정으로 둔 것과 차이를 증명하지 못했어요'를 **반드시** 쓴다(차이가 없다는 것도 성적이다)
"""
target_hit = "|실현 σ / 목표 − 1| ≤ 0.25 이면 '실현 변동성이 목표 근처였어요', 아니면 실현 σ 숫자만"
upside = "상승 포착은 숫자로 늘 쓴다(예: '오른 달 상승의 36% 만 따라갔어요'). 0.5 미만이어도 숨기지 않는다"

[exploratory]
items = [
  "매일 리밸런스(같은 규칙 · 같은 비용)",
  "밴드 리밸런스 — 목표와 흘러간 비중 차가 한 종목이라도 5%p 를 넘은 날만",
  "상한 0.3",
]
note = "탐색은 화면 고지에 쓰지 않는다. 쓰려면 새 키로 다시 등록한다"
