# 사전등록 — 원인 설명 채점: 패널이 '가장 유력'이라 한 원인 종류가 다음 등락을 업종(시장) 몫보다 더 잘 설명하나
# (F017 v4 순서 5c · FC-REQ-022 FR-15 · 원인 기록은 서버 cause_snapshot — SRV-REQ-053 FR-18 · DB-REQ-043 FR-8)
#
# 이 파일은 **원인 스냅샷의 다음 등락을 한 번도 계산하기 전에** 커밋한다. 정의 · 문턱 · 지평을 바꾸려면 새 키(`cause-explain@2`).
# 사용자 2026-11-13 "사실 근거 원인" · "다 설명할 수 있잖아 우린 다 데이터가 있는데" · 2026-11-16 "새 브랜치 파고 다음 파이프라인 진행".
#
# 왜: 패널은 매일 "오늘 왜 움직였나"에 원인을 단계(가장 유력 · 가능성 · 확인된 소식 없음)로 말한다. 그 말이 맞는지 채점하지 않으면
# 설명은 그럴듯한 이야기일 뿐이다. 오늘 등락을 오늘 원인이 설명하는 것은 조립 규칙상 늘 맞으므로(근거가 방향을 받칠 때만 원인) 채점할 수 없다.
# 채점할 수 있는 것은 **원인 종류가 다음 등락에 대해 정보를 주는가**다 — 같은 종류의 과거 원인 뒤 등락으로 오늘 원인 뒤를 맞히는 것이
# 업종(코인은 시장) 몫의 부호만 아는 기준보다 나은가.
#
# ── 자료 한계(등록 시점 실측 2026-11-16) ─────────────────────────────
# 원인 기록은 2026-11-16 국내 16:40 회차부터(50종목 — 업종 유력 12 · 시장 유력 12 · 업종 가능 7 · 없음 19). 과거 원인은 다시 만들 수 없다
# (조립 재료가 '지금' 기준이라 재생하면 미래가 섞인다) → **과거 판정 없음 — 전진 시험만**.
# 맥이 평일 업무 시간에만 켜져(국내 16:40 · 코인 08:40 회차) 코인 기록은 평일 아침에 켜져 있던 날만 생긴다 — 빈 날은 빈 날.

key = "cause-explain@1"
registered = 2026-11-16

[question]
text = """
원인 스냅샷 하루 한 행(그날 마지막 기록)마다 다음 h 봉 시장 대비 초과 수익의 부호 y = 1[e_h > 0] 를,
(가) 원인 종류 K 의 과거 오른 비율 p_K 로 맞힌 Brier 가 (나) 기준 — 업종 몫 부호 S 의 과거 오른 비율 p_S 로 맞힌 Brier 보다 작은가.
"""

[protocol]
source = "public.v_cause_snapshot_export — (market, symbol, trade_date) 마다 captured_at 이 가장 늦은 행(그날 마지막 원인). 찍는 창은 서버 규칙(국내 15:40 ~ 23:59 KST · 코인 08:00 ~ 08:59 KST, 거래일 = 그 하루)"
kr_prices = "forecast.price_bar kis 1d — 거래일 = 봉 available_at 의 KST 날짜. 그 날 봉이 없으면(휴장 · 수집 구멍) 그 행 제외"
crypto_prices = "forecast.price_bar upbit 1d — 거래일 = 봉 available_at 의 KST 날짜 − 1일(09:00 ~ 다음 날 09:00 하루)"
in_time = "captured_at < 거래일 봉 available_at + 1 봉 — 라벨 첫 봉이 닫히기 전 기록만(서버 창 규칙으로 늘 참이어야 한다 — 거짓이면 제외하고 수를 리포트)"
label = "e_h = ln(C_{t+h} / C_t) − 같은 시장 · 같은 날 · 같은 h 의 스냅샷 종목 동일가중 평균. y = 1[e_h > 0], e_h = 0 은 제외(수를 리포트)"
kind = "K = top_kind (top_strength = likely 일 때만), 아니면 'not_likely'(가능성 · 없음을 한 칸으로) — FR-15 '가장 유력이라 한 원인 종류별로'"
baseline = "S = 국내: split.sector 부호(+ · − · 0/없음은 split.market 부호로, 그것도 없으면 'none') / 코인: split.market 부호(없으면 'none')"
estimate = "p_K · p_S = (과거 오름 + a · p_all) / (과거 수 + a), a = 20, p_all = 과거 전체 오른 비율(과거 0 이면 0.5). '과거' = 같은 시장 · 같은 h, 라벨 available_at ≤ 이 행 captured_at"
cold = "과거 같은 K 또는 같은 S 가 30 행 미만이면 그 행은 채점 안 함(cold — 수를 리포트)"
stat = "d = (p_S − y)² − (p_K − y)². 날짜별 평균 d 를 먼저 내고 날짜 수준 t(Newey–West 시차 h), 단측 d > 0. skill = 1 − Brier_K / Brier_S"
cells = "시장(kr · crypto) × 지평(1 · 5) = 4칸"
min = "채점 행 ≥ 300 · 서로 다른 날 ≥ 30 이 아니면 그 칸 below_min"

[decision]
pass = "칸마다 단측 p 가 그날 Holm(4, α = alpha_per_look) 통과"
display = "통과한 칸만 패널 '오늘 왜 움직였나' 결과 줄에 '이런 원인 뒤 다음 날은 100번 중 n번 올랐어요'(그 K 의 과거 실제 비율 · 표본). 판정 전 · 실패엔 지금 문구 그대로(원인 종류의 다음 등락 숫자를 싣지 않는다)"
fail = "마지막 판정 날짜에 통과 못 하면 fail(사유 = below_min > no_effect)"
apply = "원인 종류 · 단계 규칙(서버 MoveCause.ts) 변경은 기록 지문이 바뀌어 같은 표본에 섞인다 — 리포트에 규칙 변경 날짜를 적고, 종류 목록이 바뀌면 새 키"

[forward]
predict = "매일 작업이 원인 스냅샷을 온톨로지 ③ cause_candidate 로 옮기고, 닫힌 라벨을 ④ outcome 으로 쓴 뒤 칸을 계산한다"
sample = "이 등록 뒤(2026-11-16 ~) 기록된 원인 스냅샷 중 라벨이 닫힌 행"

[looks]
dates = ["2027-01-15", "2027-02-14", "2027-03-16"]   # 등록 뒤 60 · 90 · 120일
alpha_per_look = 0.0166667
family = "한 날짜 안 Holm — 그날 판정하는 칸"
