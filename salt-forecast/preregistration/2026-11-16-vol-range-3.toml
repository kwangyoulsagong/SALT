# 사전등록 — H1 흔들림 · 범위 v3: @1 + 동결 재생 (F017 v4 순서 4 · FC-REQ-028 FR-9 H1 · 2026-11-16)
#
# 이 파일은 @3 의 어떤 예측 · 결과보다 먼저 커밋한다. 바꾸려면 새 키(`vol-range@4`). `vol-range@2` 는 @1 apply 가
# "코인 1h · 4h 지평"으로 예약해 두어 건너뛴다.
#
# ── 왜 @3 인가 ───────────────────────────────────────────────────────
# 2026-11-16 맥(유일한 서버)이 평일 업무 시간에만 켜지게 됐다(사용자 결정 — 포트폴리오 프로젝트라 배포하지 않는다).
# @1 은 "다음 봉 전에 기록한 예측"만 표본이라 코인 금 · 토 밤 기록(토 · 일 시작 표적일)이 구조적으로 빠진다.
# 1차 walk-forward 를 요일로 나눠 실측(2026-11-16, 판정 아님 · 전진 결과 미열람): h1 80% 덮임 전체 80.46% → 평일 시작만 78.12%
# (토 86.3 · 일 83.5% 가 빠짐) — 덮임 띠 [78, 82] 아래 끝에 붙는다. 가동 패턴이 판정을 움직이므로 재생으로 전 요일을 되찾는다.
#
# @1 전진 표본: 예측 약 580행 · 채점 0행(2026-11-16). @1 행은 @3 표본에 넣지 않는다.

key = "vol-range@3"
registered = 2026-11-16
supersedes = "vol-range@1"
same_as = "vol-range@1 — [question] [protocol] [decision] (pass_a · pass_b · placebo · history_judgment · display) · [looks] dates · alpha · family · min_days · rule"

[forward]
predict = "@1 그대로 — 매일 시험 작업이 칸마다 마지막 봉의 예측 RV · 80 · 95% 구간을 쓴다"
replay = """
동결 재생 — 예측이 없는 기준 봉(맥이 잠든 날)은 깨어난 뒤 다시 만든다.
(1) 입력: 그 봉 available_at 까지로 자른 패널(crypto_panel · kr_panel 의 as_of) — 적합 · 컨포멀 · 기준 전부 그 패널에서(실시간과 같은 함수 live_cells)
(2) 코드: 그 봉 시각에 돌던 시험 실행의 model_version 과 지금 코드가 같을 때만. 다르면 그 봉은 비운다
(3) 고를 여지 없음: 등록 뒤 · 지금으로부터 14일 안 · 예측이 없는 기준 봉 **전부**. 이미 쓴 행은 덮지 않는다
(4) 구분: 재생 행은 recorded_at = 실제로 쓴 시각 → 채점 때 in_time = false. 실시간은 늘 마지막 봉만 쓰므로 늦은 행은 재생뿐
"""
sample = "이 키 예측(실시간 + 재생) 중 라벨이 닫히고 기준 봉이 2026-11-17 00:00 UTC 뒤인 것. 판정 날짜엔 **그 날짜 00:00 KST 전 기준 봉만**(늦게 돌아도 같은 표본). 다른 키와 합치지 않는다"
sensitivity = "실시간(in_time) 행만으로 같은 지표를 로그에 — 판정에 쓰지 않는다"

[looks]
dates = ["2027-01-12", "2027-02-11", "2027-03-13"]   # @1 과 같은 날짜(가동 때문에 판정을 늦추지 않는다)
alpha_per_look = 0.0166667
family = "한 날짜 안 Holm — 그날 판정하는 칸 × 기준"
min_days = 30
rule = "@1 그대로 — 마지막 날짜까지 못 넘으면 fail(날 < 30 이면 below_min)"
