# 사전등록 — 단타 방향 확률 v3: 전진 시험(등록 뒤 실제로 낸 예측만으로 판정) (F017 v2 단계 5 · FC-REQ-028 FR-1 · FR-4)
#
# 이 파일은 @3 의 어떤 예측 · 결과보다 먼저 커밋한다. 바꾸려면 새 키(`short-direction@4`).
#
# ── 왜 전진 시험인가 ──────────────────────────────────────────────────
# @1 · @2 · 진단으로 2024-11 ~ 2026-11 기간을 세 번 봤다(리포트 short-direction-short-direction-{1,2}-2026-11-11.md). 그 기간으로 다시 판정하면
# 결과를 보고 고른 규칙이 된다. 그래서 @3 는 **이 커밋 뒤에 낸 예측**만 채점한다 — 예측이 결과보다 먼저 기록되므로 누수가 구조적으로 없다
# (플라시보를 쓰지 않는다. 코드 누수는 tests/leakage 가 지킨다). 사용자 2026-11-11 "베스트 케이스로" · "신뢰도가 좋은거자나".
#
# ── @2 에서 고친 것 ──────────────────────────────────────────────────
# 기준 (4) '확신 적중 > 늘 오른다'는 오른 비율이 50% 가 아니면 공짜로 넘는다(@2 진단: 확신 99% 가 '안 오름' 쪽).
# → **늘 많은 쪽**(같은 확신 행에서 늘 오른다 · 늘 안 오른다 중 더 많이 맞힌 쪽) 대비로.
# 라벨은 그대로 y = 1[r > 0] — 화면이 '안 올랐어요(내렸거나 그대로)'로 말한다. '그대로' 비율은 리포트에 칸마다 적는다.

key = "short-direction@3"
registered = 2026-11-11
supersedes = "short-direction@2"
same_as = "short-direction@2 — [cells] [protocol.*] [features] [model] [walk_forward](적합 방법 · 창) · 분위 · 무효선"

[forward]
fit = """
매일 시험 작업이 칸마다 직전까지의 전 이력으로 walk-forward 를 돌려 **마지막 블록 적합**(원래 모델 + 피처 없는 같은 모델)을 저장한다.
과거 구간 성적은 '본 기간 검산 — 참고'로만 리포트 · 화면 성적에(라벨 backtest) — 판정에 쓰지 않는다
"""
predict = "모든 시험 칸(코인 1h · 4h · 1d 매시 · 국내 1d 거래일 16:00 뒤)의 유니버스 종목마다 p(원래) · p_ref(피처 없는 모델)를 같은 행에 쓴다"
sample = "판정 표본 = 이 키로 쓴 예측 중 만료 · 채점이 끝난 것(available_at 이 이 등록 커밋 뒤). 다른 키 예측과 합치지 않는다"

[looks]
dates = ["2027-01-10", "2027-02-09", "2027-03-11"]   # 등록 뒤 60 · 90 · 120일. 이 날짜의 매일 작업에서만 판정한다 — 그 사이엔 상태 forward
alpha_per_look = 0.0166667                            # 0.05 / 3(본 횟수만큼 나눔)
family = "한 날짜 안 Holm — 그날 판정하는 칸들"
min_days = 30                                         # 칸마다 서로 다른 예측 날 ≥ 30 이 아니면 그 날짜엔 판정 보류(forward 유지)

[decision]
pass = """
판정 날짜에 칸마다 전부: (1) BSS(p vs p_ref) 날짜 블록 부트스트랩 단측 p 가 Holm(그날 칸들, α = alpha_per_look) 통과 그리고 95% CI 하한 > 0
(2) ECE ≤ 0.03 (3) 확신 행(p ≥ 0.55 · ≤ 0.45) ≥ 300 그리고 (확신 적중 − 늘 많은 쪽 적중) 95% CI 하한 > 0
(4) 확신 '오름' 행 ≥ 30 이면 비용 뒤 평균 > 0(30 미만이면 이 항목 없음 — '오름'을 거의 말하지 않는 모델은 '오를 확률'을 높게 말하지 않는다)
"""
fail = "마지막 판정 날짜(2027-03-11)에 통과 못 하면 그 칸 fail(사유 = 처음 걸린 것: no_skill(1) > miscalibrated(2) > no_edge_confident(3) > cost(4))"
display = """
통과한 칸은 그날부터 renderable(라이브로 증명 — live_ready = true). 그 뒤 매일: 라이브 확신 행 기준 (적중 − 늘 많은 쪽) CI 상한 < 0 이면
live_underperforms 로 끈다(재점등은 새 키). 판정 전 칸은 상태 forward · 사유 awaiting_live — 화면은 확률 없이 '쌓는 중'
"""
report = "매일 리포트에 칸마다 라이브 표본(예측 · 채점 · 날) · 지금까지 BSS · ECE · 확신 적중 vs 늘 많은 쪽 — 판정 날짜 전에는 '참고(판정 아님)' 표시"
