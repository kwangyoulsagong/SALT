# 사전등록 — 시장 국면 게이트 · 이벤트일 축소 · 변동성 손절 · 익절 (F010 슬라이스 2 · FC-REQ-009)
#
# 이 파일은 **결과를 보기 전에** 커밋한다. 커밋 시각 · 해시가 등록 증거다.
# 등록 뒤 판정 규칙을 바꾸려면 새 키(`regime-gate@2`)로 새 파일을 만든다 — 덮어쓰지 않는다.
# `jobs/regime_gate` 가 이 파일을 `forecast.preregistration` 에 한 번 쓰고, 같은 키에 다른 내용이면 실패한다.

key = "regime-gate@1"
registered = 2026-09-29

[question]
text = """
1. 시장 국면 게이트(닫히면 신규 매수 후보 · 권장 비중을 0 으로)가 롱온리 노출의 최대 낙폭을 줄이면서
   상승을 절반 이상 따라가는가. 통과한 게이트 중 하나만 서버에 넣는다. 하나도 통과하지 못하면 게이트를 넣지 않고
   국면은 라벨로만 보인다.
2. FOMC · CPI 발표일의 BTC 변동성이 평소보다 큰가. 크면 그날 권장 비중을 그 비율만큼 줄인다.
3. 손절 1σ · 익절 2σ 는 판정 대상이 아니다 — 슬라이스 1 라벨(삼중 장벽)과 같은 정의라서 정의로 채택한다.
   여기서는 "얼마를 지킬 수 있나"를 기록만 한다(고정 % 와 나란히).
"""

[protocol]
source = "업비트 원화 일봉 forecast.price_bar(upbit, 1d). 봉 경계 = UTC 자정(KST 09:00)"
timing = "게이트 값은 일봉 t 종가까지로 계산하고, 노출은 t+1 일봉 수익률에 적용한다(하루 늦게 행동)"
period = "2019-10-01 ~ 실행일 전날. 시작일은 HMM 첫 적합(확장 창 최소 730일)과 200일선이 모두 가능한 첫 달"
cost = "노출이 바뀐 날 |Δ노출| × 0.05%(편도) 차감. 보유 전략의 리밸런스 비용은 넣지 않는다(두 쪽에 같지 않으므로 게이트에 불리한 쪽으로 둔다)"
assets = [
  "btc — KRW-BTC 하나",
  "ew — 업비트 원화 동일가중: 그 날 봉이 있고 첫 봉 뒤 60일이 지난 종목, 매일 동일가중(일 단순수익 평균). 지금 상장 종목만 있다(생존 편향 — 리포트에 적는다)",
]
returns = "일 로그수익 ln(C[t]/C[t-1]). 전략 일수익 = 노출[t-1] × 보유 일 단순수익 − 비용, 로그로 누적"

[gates]
# 셋 다 BTC 로만 계산한다 — ew 에도 같은 BTC 게이트를 건다(알트는 BTC 레버리지다, 리서치 §4-2)
trend = "BTC 종가 > 200일 단순이동평균 → 노출 1, 아니면 0. 200일이 안 차면 게이트 없음(노출 1)"
hmm = """
2상태 가우시안 HMM, 관측 = BTC 일 로그수익(1차원). 매월 1일(UTC) 그 전날까지 전 기간(확장 창)으로 적합.
EM 최대 500회 · 로그우도 증가 < 1e-6 이면 종료 · 초기값 10개(seed 20260929) 중 최대 우도.
고변동 상태 = 분산이 큰 쪽. p_high = 그 달 파라미터로 첫 관측부터 t 까지 **forward 필터**(스무딩 금지 — 미래 관측이 섞인다).
p_high > 0.5 → 노출 0, 아니면 1
"""
both = "trend 와 hmm 이 둘 다 열려야 노출 1"

[metrics]
mdd = "로그 누적 곡선의 최대 낙폭(양수 크기, 단순 비율로 표시)"
cagr = "연 365일 환산"
calmar = "CAGR / MDD"
upside_capture = "보유 월 로그수익이 양(+)인 달들의 전략 월 로그수익 합 / 보유 월 로그수익 합"
downside_capture = "음(−)인 달들에 대해 같은 식"
delta_mdd = "MDD_보유 − MDD_게이트. 양수 = 게이트가 덜 빠졌다"
ci = "일 수익 쌍(보유, 전략)을 같은 인덱스로 이동 블록 부트스트랩 — 블록 30일 · 2000회 · seed 20260929 · 경로마다 delta_mdd → 2.5% · 97.5%"

[decision]
adopt = "btc 와 ew **둘 다**에서 delta_mdd CI 하한 > 0 이고 upside_capture 점추정 ≥ 0.5"
tie_break = "여럿이 통과하면 min(Calmar_btc, Calmar_ew) 가 가장 큰 것 하나"
none = "통과 0 — 게이트를 넣지 않는다. 국면 값은 원장 · 응답에 라벨로만"
server = """
채택되면 서버는 (a) 모드 판단 '후보'를 게이트가 닫힌 날 '관망'으로 낮추고(사유 코드 regime_gate, 규칙 버전 올림)
(b) 사이즈 점검 권장 비중을 0 으로 한다. 게이트 값은 매일 이 작업(라이브)이 쓴 행을 읽는다 — 서버가 다시 계산하지 않는다
"""

[event_day]
kinds = ["fomc", "cpi"]
day = "발표 시각(forecast.scheduled_event.event_at)을 포함한 UTC 일봉"
period = "2021-01-01 ~ 실행일 전날(이벤트 원천 시작)"
ratio = "σ_ratio = BTC 일 로그수익 표준편차(이벤트일) / 표준편차(그 밖의 날)"
ci = "두 집합을 각각 복원 추출(iid — 이벤트일은 서로 한 달 가까이 떨어져 있다) 2000회 · seed 20260929 → σ_ratio 2.5% · 97.5%"
adopt = "σ_ratio CI 하한 > 1 이면 축소 계수 = 1 / σ_ratio 점추정(0.05 단위 내림, 하한 0.5). 아니면 축소 없음(계수 1)"
server = "사이즈 점검 시점부터 24시간 안에 fomc · cpi 발표가 있으면 권장 비중 × 축소 계수"
exploratory = ["jobs(고용) 같은 방식", "발표 다음 날"]

[stops]
# 판정 대상이 아니다 — 기록만. 서버 익절 계획은 이 정의로 바뀐다(σ 가 없으면 고정 % 로 두고 그렇다고 표시)
sigma = "EWMA(λ 0.94) 일 σ, t 까지 수익률만. σ_h = σ × √h"
h_days = 20
volatility_plan = "손절 = 기준가 × exp(−1·σ_h) · 1차 익절 = × exp(+2·σ_h) · 추세 유지 = × exp(+3·σ_h)"
fixed_plan = "손절 × 0.92 · 1차 익절 × 1.12 · 추세 유지 × 1.25 (지금 서버)"
report = """
ew 종목 × 매일 진입(첫 봉 뒤 60일 지난 종목, 2019-10-01 ~) 에 대해 h 일 안의 첫 도달:
손절 먼저 · 1차 익절 먼저 · 둘 다 아님 비율, 손절 도달 시 실제 손실(종가 기준 — 갭으로 더 빠진 것 포함) 평균 · 5% 분위,
추세 유지 도달 비율. 두 계획을 나란히. 종목 · 날짜가 겹치므로 CI 는 적지 않고 표본 수만 적는다
"""

[exploratory]
gates = [
  "drawdown — BTC 365일 고점 대비 낙폭 ≤ −20% 면 노출 0.5",
  "vol_pct — BTC 30일 실현 σ 가 직전 3년 분포의 80% 분위를 넘으면 노출 0",
  "vol_target — 노출 = min(1, 0.15 / EWMA 연율 σ)",
  "hmm3 — 3상태(가장 분산 큰 상태만 닫음)",
]
note = "탐색은 판정에 쓰지 않는다. 결과가 좋아도 채택하려면 새 키로 다시 등록한다"
