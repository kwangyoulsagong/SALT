# 사전등록 — 국내 장기 "24시간 변화" 항목, 빼는 규칙을 라이브로 전진 시험 (F017 v2 단계 1b · FC-REQ-028 FR-6)
#
# 이 파일은 라이브 데이터를 한 건도 보기 전에 커밋한다(국내 판단 원장 첫 행 = 2026-11-10 17:44 KST). 바꾸려면 새 키.
#
# 배경: `rule-ic-kr@1`(2026-11-10, 2021-10 ~ 2026-11 국내 일봉)이 장기 change24h 를 "가중 0"(IC +0.004, CI [-0.003, +0.011])으로 판정했다.
# 그 결과로 지금 규칙을 바꾸지 않는 이유(사용자 "베스트 케이스로" 2026-11-10 — 판단 위임):
#   1. 바꾸면 2021 ~ 2026 국내 데이터가 "규칙을 고를 때 본 기간"이 된다 — 국내 장기 3종을 채우는 과거 검산(피하기 15,311 · 관망 35,994)을
#      화면에 못 쓴다. 라이브 국내 장기 피하기는 2건뿐이라 몇 달 동안 3종 결함이 된다(ADR-010 v2 "3종은 늘 다")
#   2. 바꾸면 라이브 국내 장기 표본(50)이 새 규칙 버전으로 처음부터 쌓인다
#   3. 판정은 "가중 0"이지 "반대"가 아니다 — 점추정이 양수라 지금 항목이 점수를 해친다는 근거가 없다
# 대신 빼는 규칙을 **라이브 원장 위에서 전진 시험**한다 — 같은 원장 행의 항목별 기여(`components`)로 두 점수를 다 계산할 수 있어 코드 변경이 없다.

key = "kr-long-change24h@1"
registered = 2026-11-10
rule_current = "mode-decision@2 — 국내 장기 = 50 + change24h(±6) + rsi_d1(−12/+8)"
rule_candidate = "같은 규칙에서 국내 장기 change24h 기여만 0 — 50 + rsi_d1"

[data]
source = "public.judgment_ledger WHERE asset_class = 'kr_stock' AND mode = 'long_term' AND sample_origin = 'live' AND rule_version = 'mode-decision@2'"
start = 2026-11-11   # 첫 발행일(11-10) 다음 날부터 — 등록과 같은 날 행은 쓰지 않는다
label = "판단일 종가 → 21 거래일 뒤 종가 로그수익률(rule-ic-kr@1 과 같은 장기 지평 · 상향 끊김 걸친 라벨 제외)"
universe = "원장에 남은 종목 그대로(kr-universe 대상 · 이력 · 신선도 조건은 발행 때 이미 걸림)"

[test]
primary = "후보 점수(50 + rsi_d1 기여)와 현재 점수의 거래일별 종목 간 스피어만 IC 차이 — 날짜 평균, 이동 블록 부트스트랩 95%(블록 42 · 2000회 · seed 20261110)"
secondary = "change24h 기여 단독의 라이브 IC(rule-ic-kr@1 과 같은 계산) — 과거 판정이 표본 밖에서도 0 인가"
min_dates = 120      # 거래일 — 약 6개월. 그 전엔 계산하지 않는다(엿보기 금지)
first_look = 2027-06-14   # 120 거래일 + 라벨 21 거래일 ≈ 141 거래일 뒤

[decision]
drop = "후보 − 현재 IC 차이 CI 하한 > 0 이거나, change24h 단독 라이브 IC CI 상한 < 0 → 국내 장기 change24h 가중 0 을 새 규칙 버전으로(서버 REQ). 그때 과거 검산은 2026-11-11 이후 행만 표본 밖"
keep = "change24h 단독 라이브 IC CI 하한 > 0 → 지금 규칙 유지, 이 등록 닫음"
undecided = "그 밖 — 유지하고 2027-11 에 같은 방법으로 한 번 더(새 키)"
note = "결정은 사람이 내린다 — 이 등록은 비교 숫자와 기준을 먼저 고정할 뿐 자동으로 규칙을 바꾸지 않는다"
