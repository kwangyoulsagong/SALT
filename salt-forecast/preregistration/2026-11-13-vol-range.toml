# 사전등록 — H1 흔들림 · 범위: 다음 하루 · 5일 얼마나 흔들리나 (F017 v4 순서 4 · FC-REQ-028 FR-9 H1)
#
# 이 파일은 **이 데이터로 변동성 예측을 한 번도 돌리기 전에** 커밋한다. 모델 · 기준 · 지평 · 문턱 · 판정 날짜를 바꾸려면 새 키(`vol-range@2`).
# 사용자 2026-11-13 "2번은 ㄱㄱㄱ"(먼저 등록할 실험 = H1 · H3).
#
# 왜 H1 이 먼저인가 — 방향(오를까)은 우리도 연구진도 52% 근처에서 막힌다(리서치 A · short-direction@1~3).
# 흔들림(얼마나 움직일까)은 수십 년 문헌에서 거듭 맞힌 몇 안 되는 예측이다(HAR · 변동성 군집). 화면에서는
# "내일 이 정도 범위 안에서 움직일 때가 100번 중 80번" · "나빴을 땐 여기까지" — 잃지 않게 하는 숫자다.
#
# ── 자료 한계(등록 시점 실측 2026-11-13) ─────────────────────────────
# forecast.price_bar 에 5분봉 이력이 없다(FC-REQ-028 FR-9 초안의 "5분봉 실현변동성"은 쓸 수 없다 → 이 등록에서 정정).
# 코인 = upbit 1h(2024-11-01 ~ · 301종목)로 하루 실현변동성. 국내 = kis 1d(2021-10-12 ~)만 있어 하루 고가 · 저가 · 시가 · 종가 범위 추정.
# 이 기간의 변동성 예측 결과는 아직 아무도 보지 않았다 — 그래서 과거 walk-forward 를 1차 판정으로 쓰고, 등록 뒤 전진 시험이 확인한다.

key = "vol-range@1"
registered = 2026-11-13

[question]
text = """
(a) 다음 1 · 5 봉(국내 거래일 · 코인 하루)의 실현분산을 HAR 가 기준 셋보다 잘 맞히나 — QLIKE 손실.
(b) 그 예측으로 만든 80% · 95% 수익 구간이 실제로 80% · 95% 를 덮나 — 덮임 오차 ±2%p 안.
'흔들림 예측'이라고 화면에 쓰는 것은 (a) · (b) 둘 다 통과한 칸만.
"""

[protocol]
kr_source = "forecast.price_bar kis 1d(수정주가). available_at = 그 거래일 16:00 KST. 유니버스 = kr-universe@1. 끊김(domain/kr_breaks)이 창에 있으면 제외 — base-rate@1 과 같다"
crypto_source = "forecast.price_bar upbit 1h(원화 마켓, 2024-11-01 ~) · 하루 = KST 09:00 ~ 다음 날 09:00(업비트 일봉 경계). available_at = 하루 끝 09:00 KST. 그날 1h 봉이 22개 미만이면 그날 없음"
target_crypto = "RV_t = Σ (ln C_h / C_{h−1})²  — 그날 1h 로그수익 제곱합"
target_kr = "RV_t = Garman–Klass: 0.5·(ln H/L)² − (2 ln2 − 1)·(ln C/O)² + (ln O / C_{t−1})² (밤사이 갭 포함). 음수면 0 으로 자르지 않고 표본에서 뺀다(리포트에 건수)"
target_h = "h = 5 이면 RV_{t+1..t+5} 합"
model = "HAR-RV(로그): ln RV_{t+1..t+h} = b0 + b1 ln RV_t + b2 ln mean(RV_{t−4..t}) + b3 ln mean(RV_{t−21..t}) + e. 시장 · 지평마다 하나의 풀링 OLS(종목 고정효과 없음 — 새 종목도 같은 식). 로그 역변환은 exp(ŷ + σ̂²/2)"
baselines = """
B1 어제와 같다: RV_t × h
B2 EWMA λ = 0.94: 직전 수익 제곱의 지수 평균 × h (RiskMetrics)
B3 과거 22봉 평균 × h
"""
as_of = "봉 마감 뒤. 피처는 available_at <= as_of 봉만 — tests/leakage 에 이 작업의 경계 테스트를 더한다(마지막 봉 하나를 미래로 옮기면 실패해야 한다)"
walk_forward = "확장 창 · 재적합 매월 1일 · 첫 적합 = 처음 250봉(국내) · 180일(코인). 퍼지 = h 봉 · 엠바고 = 5 봉. 무작위 분할 0"
interval = """
r_{t+1..t+h} 구간 = ± z · sqrt(예측 RV) 대신 **컨포멀**: 직전 250 표본(같은 시장 · 지평)의 |r| / sqrt(예측 RV) 분위 q_0.80 · q_0.95 로 폭을 정한다.
보정 창도 as_of 이전 라벨만(라벨이 닫힌 표본만). 중심 = 0(방향을 예측하지 않는다)
"""
loss = "QLIKE = RV/ŷ − ln(RV/ŷ) − 1. 보조로 log-MSE · 대표 종목 표는 리포트에만"
n_eff = "같은 날 몰림 — 비교는 날짜별 평균 손실 차이 d_t 의 시계열로(종목을 날짜 안에서 먼저 평균). 표준오차 = Newey–West, 시차 = h + 5"
cells = "시장(kr · crypto) × 지평(1 · 5) = 4칸"

[decision]
pass_a = "칸마다 HAR 의 평균 QLIKE 가 B1 · B2 · B3 각각보다 작고 Diebold–Mariano 단측 p 가 Holm(4칸 × 기준 3 = 12 검정, α 0.05) 통과"
pass_b = "칸마다 80% · 95% 구간 덮임이 각각 [78, 82] · [93, 97]% 안 그리고 덮임을 연도별로 나눠도 어느 해도 ±5%p 밖이 아니다"
placebo = "피처 순서를 날짜 블록(20봉)으로 섞은 HAR 로 같은 검정 — 통과 칸이 생기면 그 시장 전체 판정 보류(파이프라인 누수 의심)"
history_judgment = "과거 walk-forward(위 자료 끝 = 2026-11-12)로 1차 판정. 통과 칸만 다음 [forward] 로 간다. 실패 칸은 fail(사유 = 처음 걸린 것: no_skill(a) > miscalibrated(b) > placebo)"
display = "1차 통과 + 전진 시험 첫 판정 통과 칸만 화면에 '흔들림 범위'(80% 범위 · 95% 하단 = '나빴을 땐'). 그 전엔 base-rate@1 q10 · q90(과거 실제 결과)만"
apply = "모델 · 기준 · 창 · 덮임 문턱 변경 = 새 키. 1h · 4h 지평(코인)은 1h 이력 1년 더 뒤 vol-range@2"

[forward]
predict = "매일 시험 작업이 칸마다 마지막 적합으로 예측 RV · 80 · 95% 구간을 쓴다(available_at = 이 등록 커밋 뒤만 판정 표본)"
sample = "이 키 예측 중 라벨이 닫힌 것. 다른 키와 합치지 않는다"

[looks]
dates = ["2027-01-12", "2027-02-11", "2027-03-13"]   # 등록 뒤 60 · 90 · 120일
alpha_per_look = 0.0166667
family = "한 날짜 안 Holm — 그날 판정하는 칸 × 기준"
min_days = 30
rule = "전진 표본에서 pass_a · pass_b 를 다시. 마지막 날짜까지 못 넘으면 그 칸 fail · 화면에서 내린다(재점등은 새 키)"
