# 사전등록 — BTC 도미넌스 변화가 다음 주 "알트 − BTC" 상대 수익을 말해 주나 · 라이브 통계 (F010 슬라이스 6 2차 · FC-REQ-015)
#
# 이 파일은 **첫 수집 전에** 커밋한다. 커밋 시각 · 해시가 등록 증거다.
# 등록 뒤 신호 · 지평 · 판정 조건을 바꾸려면 새 키(`dominance@2`)로 새 파일을 만든다 — 덮어쓰지 않는다.
#
# 왜 라이브인가: 도미넌스 이력은 무료 원천이 없다. CoinGecko `/api/v3/global` 은 지금 값만 주고(무키 확인 2026-10-06),
# 이력 `/global/market_cap_chart` 는 유료(PRO, error_code 10005)다. Coin Metrics 무료 시가총액은 135종뿐이고
# SOL · BNB(2019-04 뒤) 가 빠져 있어 그 합으로 도미넌스를 만들면 2021 뒤 알트 몫이 체계적으로 작게 나온다 — 과거 표본을 만들지 않는다.
# 그래서 `market-warning@1` 과 같이 **매일 스냅샷을 쌓고, 미리 정한 날에 한 번 본다.** 그 전에는 계산하지 않는다(엿보기 금지).
#
# 배경: 리서치 §7-2 는 도미넌스를 공포탐욕 구성요소(10%)로만 다뤘고 독립 신호로 채점하지 않았다. 목표 비중 알트 몫은
# target-weight@2 에서 채택 없음 → "알트: 기록 없음"이다. 이 등록은 그 결론을 뒤집는 근거가 될 수 있는지 **라이브로만** 본다.

key = "dominance@1"
registered = 2026-10-06
first_check = 2027-05-17   # 첫 신호(2026-11-09 — 4주 변화가 필요) 뒤 26주 + 결과 1주. 그 전에는 계산하지 않는다

[data]
source = """
CoinGecko `GET /api/v3/global` (키 없음) → data.market_cap_percentage.btc · .eth (%), data.total_market_cap.usd,
data.updated_at(원천 갱신 시각, epoch 초). 하루 1요청.
observed_at = updated_at, available_at = 우리가 받은 시각(fetched). 둘 다 저장한다 — 지금 상태만 주는 원천이라
과거 시각으로 적지 않는다(`--as-of` 와 무관하게 실제로 받은 시각).
"""
license = "CoinGecko 무료(Demo 없이) · 출처 표기 조건 — 피처 · 채점 전용(화면 표시 없음). 표시하게 되면 표기부터"
prices = "업비트 원화 일봉 forecast.price_bar(upbit, 1d), 봉 경계 UTC 자정"

[protocol]
grid = "매주 월요일 00:00 UTC 마감 봉 t(목표 비중 리밸런스와 같은 날). 2026-10-12 부터"
signal = """
D[t] = available_at ≤ t 인 가장 최근 BTC 도미넌스(%). 그 값이 t − 2일보다 오래됐으면 그 주는 결측.
s[t] = D[t] − D[t − 28일](같은 규칙으로 고른 값). 둘 중 하나라도 결측이면 그 주 결측. 첫 신호는 2026-11-09 근처
"""
outcome = """
y[t] = ALT[t → t+7] − BTC[t → t+7] (로그수익, 7일).
ALT = target-weight@1 alt_universe(t 기준 상장 60일 이상 · 최근 30일 원화 거래대금 상위 10, BTC · ETH 제외)의 동일가중 단순수익 → 로그.
그 주 업비트 투자유의 종목(forecast.v_market_warning 에서 t 에 warning)은 뺀다
"""
statistic = "IC = 스피어만(s, y), 결측 주 제외, 비겹침 주 단위. 기대 부호 음(−): 도미넌스가 오르면 다음 주 알트가 BTC 보다 약하다"
ci = "주 단위 이동 블록 부트스트랩 — 블록 4주 · 2000회 · seed 20261006 · 분위 [2.5%, 97.5%]"
min_weeks = 26

[decision]
at_first_check = """
n ≥ 26 이고 IC 95% CI 상한 < 0 이면 '라이브 근거 있음'으로 리포트에 적는다. 그래도 **규칙 · 화면은 바꾸지 않는다** —
알트 몫 규칙에 쓰려면 이 결과를 근거로 target-weight@3 을 결과 전에 새로 등록하고 그 등록의 판정을 거친다.
n < 26 이면 '표본 부족'으로 적고 다음 확인은 26주 뒤(같은 등록, 같은 통계).
CI 가 0 을 포함하거나 부호가 반대면 '근거 없음'. 도미넌스 수집은 계속한다(비용 하루 1요청).
"""
no_peek = "first_check 전에는 s · y 를 함께 계산하는 코드를 돌리지 않는다. 수집 상태(행 수 · 결측 주)만 본다"

[exploratory]
eth_dominance = "ETH 도미넌스 4주 변화로 같은 통계"
horizon_4w = "y 를 4주(비겹침 4주 격자)로 — n 이 1/4 이라 첫 확인에서는 표본 수만 적는다"
