# 사전등록 — H3 큰 움직임 × 소식 v3: @1 + 늦은 사건 동결 재생 (F017 v4 순서 4 · FC-REQ-028 FR-9 H3 · 2026-11-16)
#
# 이 파일은 @3 의 어떤 사건 기록 · 결과보다 먼저 커밋한다. 바꾸려면 새 키(`move-news@4`). `move-news@2` 는 @1 apply 가
# '소식 종류별'로 예약해 건너뛴다.
#
# ── 왜 @3 인가 ───────────────────────────────────────────────────────
# 2026-11-16 맥(유일한 서버)이 평일 업무 시간에만 켜지게 됐다(사용자 결정 — 포트폴리오 프로젝트라 배포하지 않는다).
# 실측(판정 아님 · 전진 결과 미열람): 코인 '소식 있음' 사건 10건 중 7건이 잠든 시간에 게시된 기사에서 나왔다 — 서버 크롤러는
# RSS 최근 기사만 받아 잠든 동안 기사가 사라지고, 주말 사건은 라벨 전에 기록되지 못해 표본에서 빠졌다.
# 서버 크롤러에 같은 검색어 10개의 날짜 범위 검색 메우기를 넣고(원천 정의 그대로 · 빠진 기사만 채움), 주말 사건은 깨어난 뒤 기록한다.
#
# @1 전진 기록: 사건 226건 · 채점 0건(2026-11-16). @1 기록은 @3 표본에 넣지 않는다.

key = "move-news@3"
registered = 2026-11-16
supersedes = "move-news@1"
same_as = "move-news@1 — [question] [protocol](사건 2σ · 거래량 2배 · 소식 창 · 제목 거르기 · 라벨 · 쿨다운 · 비용 · 원천 덮임) [decision] [looks] dates · alpha · min · fail · apply. 코인 소식 원천 해석 = public.v_news_article_export(@1 코드 머리 '등록 해석' 그대로)"

[forward]
record = """
사건 · 소식 수 · 거래량은 그 봉까지의 값(행 t 까지 · 소식은 게시 시각이 그 창 안인 제목)으로 기록한다 — 기록 시각과 무관하게 같은 값
(tests/leakage: 미래 봉 · 창 뒤 제목이 t 의 사건을 바꾸지 않는다).
(1) 제때 사건(다음 봉 전): 그대로 기록
(2) 늦은 사건(맥이 잠든 날 — 다음 봉이 이미 열림): **깨어난 지 2시간 뒤에만** 기록(깨어남 = 5분 작업 기록에 15분 넘는 틈이 끝난 시각).
    그 사이 서버 크롤러가 잠든 동안 기사를 날짜 검색으로 메운다 — 메우기 전에 기록하면 '소식 없음'으로 굳는다
(3) 고를 여지 없음: 등록 뒤 · 지금으로부터 14일 안 · 아직 기록 안 한 사건 **전부**. 이미 기록한 사건은 덮지 않는다
(4) 구분: recorded_at = 실제로 쓴 시각 → in_time = false 가 늦은 사건
(5) 코드 가드 없음 — 이 실험은 적합 모델이 없고 판정 규칙은 이 등록의 고정 문턱이다. 사건 규칙 코드를 바꾸면 새 키
"""
sample = "이 키 기록(제때 + 늦은) 중 등록 뒤(2026-11-17 00:00 UTC 뒤) 봉 · 원천 돈 날 · 라벨 있음. 판정 날짜엔 **그 날짜 00:00 KST 전 봉만**(늦게 돌아도 같은 표본)"
sensitivity = "제때 기록만(in_time) 같은 지표를 따로 — 판정에 쓰지 않는다"
english_feeds = "영어 매체 RSS(서버 크롤러)는 날짜 검색이 없어 메우지 못한다 — 잠든 시간 영어 기사는 빠질 수 있다(한계로 리포트에 적는다)"

