# 사전등록 — Deribit DVOL(내재 변동성)이 목표 비중의 σ 를 더 잘 맞히나 (F010 슬라이스 6 · FC-REQ-014)
#
# 이 파일은 **결과를 보기 전에** 커밋한다. 커밋 시각 · 해시가 등록 증거다.
# 등록 뒤 후보 · 지표 · 판정 조건을 바꾸려면 새 키(`dvol-sigma@2`)로 새 파일을 만든다 — 덮어쓰지 않는다.
# `jobs/dvol_sigma` 가 이 파일을 `forecast.preregistration` 에 한 번 쓰고, 같은 키에 다른 내용이면 실패한다.
#
# 배경: 리서치(`requirements/reports/research/2026-09-27-ai-judgment-upgrade.md` §7-2 · §7-4)는 DVOL 을
# "방향 0 · 사이징 · 국면" 신호로 분류했다 — IV 가 RV 의 최선 예측치라는 문헌 결론. 그래서 이 등록은 방향이 아니라
# **변동성 예측**을 잰다. 지금 목표 비중(target-weight@1 · @2)은 BTC · ETH σ 를 EWMA(λ 0.94)로 쓴다.
# 등록 시점까지 DVOL 값은 연결 확인용으로 2021-03 두 점만 봤다(결과 계산 0회).

key = "dvol-sigma@1"
registered = 2026-09-30
rule_version = "target-weight@2"   # 서버 coach/domain/policy/targetWeight.ts — σ = v_realized_vol.ewma

[question]
text = """
BTC · ETH 의 앞으로 7일 실현 분산을, 지금 쓰는 EWMA σ 보다 DVOL 기반 σ 가 더 잘 맞히는가.
맞히면(아래 판정) 목표 비중의 BTC · ETH σ 를 그것으로 바꾼다. 못 맞히면 σ 는 EWMA 그대로 두고 DVOL 은 수집만 한다.
"""

[data]
dvol = """
Deribit `public/get_volatility_index_data` currency = BTC · ETH, resolution = 1D. 봉 [open, high, low, close],
값은 연율 % (30일 만기 내재 변동성). **close** 를 쓴다. 봉 시각은 시작(00:00 UTC) — available_at = 시작 + 1일
(봉이 닫힌 뒤에야 close 를 안다). 원천 이력 시작 2021-03-24(연결 확인 때 본 첫 봉).
"""
realized = """
업비트 원화 일봉 forecast.price_bar(upbit, 1d) KRW-BTC · KRW-ETH, 봉 경계 UTC 자정. 일 로그수익 r.
DVOL 은 달러 옵션 · 업비트는 원화 현물이다 — 환율 · 김치 프리미엄 변동이 실현 분산에 섞인다. 그 차이를 아래
보정 계수 k 가 수준만 흡수한다(모양 차이는 남는다 — 불리하면 DVOL 쪽에 불리하다).
"""

[protocol]
as_of = "매일 UTC 자정 t(그날 봉 마감). 피처는 available_at <= t 만. σ 는 전부 t 종가까지"
horizon_days = 7            # 목표 비중 리밸런스 주기(매주)
target = "RV7(t) = Σ_{j=1..7} r[t+j]² (업비트 원화 일 로그수익)"
forecast_units = "연 σ → 7일 분산 f = σ² × 7 / 365"
loss = "QLIKE(t) = log f + RV7 / f  (Patton 2011, 작을수록 좋다 — domain/volatility.qlike 와 같은 식)"
period = """
시작 = 모든 후보가 값을 갖는 첫 t(DVOL 첫 봉 + 보정 창 365일 + 30일 → 대략 2022-04 하순).
끝 = 실행일 − 7일(마지막 RV7 이 닫힌 날). BTC · ETH 같은 날짜 격자. 한쪽이라도 값이 없는 날은 그 종목에서 뺀다
"""
min_days = 500

[candidates]
base = "ewma — labels.ewma_sigma(λ 0.94) × √365. 지금 서버 · 목표 비중이 쓰는 값"
dvol_scaled = """
σ = DVOL[t] / 100 × k[t].
k[t] = 중앙값{ RV30σ(s) / (DVOL[s]/100) : s 는 t − 365일 ≤ s ≤ t − 30일 인 날 }.
RV30σ(s) = √(Σ_{j=1..30} r[s+j]² × 365/30) — s+30 ≤ t 라 t 시점에 전부 닫혀 있다(누수 없음).
유효한 s 가 250일 미만이면 값 없음. 내재 변동성의 위험 프리미엄(IV > RV 경향)과 원화 · 달러 수준 차이를 뺀다.
"""
blend = "σ = √(½ σ_ewma² + ½ σ_dvol_scaled²) — 가중을 적합하지 않는다(고정 ½)"

[decision]
metric = "ΔQLIKE(t) = QLIKE_후보(t) − QLIKE_ewma(t), 종목별 날짜 평균"
ci = "이동 블록 부트스트랩(날짜 단위) — 블록 30일 · 2000회 · seed 20260930. 7일 창 겹침(자기상관)을 블록이 흡수한다"
multiplicity = "후보 2 × 종목 2 = 4 검정 — Bonferroni: 양측 CI 를 [1.25%, 98.75%] 분위로 잰다"
pass = """
후보 c 는 아래 셋을 **모두** 만족해야 통과한다.
(1) BTC · ETH **둘 다** ΔQLIKE 98.75% CI 상한 < 0
(2) 앞 절반 · 뒤 절반 기간(날짜 격자를 반으로) 각각에서 두 종목 ΔQLIKE 점추정 < 0 — 한 구간 운이 아니다
(3) target-weight@1 core 규칙(목표 σ 0.15 · 상한 0.6 · 주간 · 비용 0.05%)을 같은 기간에 σ 만 c 로 바꿔 돌린
    Calmar 가 ewma 로 돌린 Calmar 이상(점추정). 예측이 나아져도 비중 결과가 나빠지면 바꾸지 않는다
"""
choose = "둘 다 통과하면 blend(σ 가 덜 흔들린다 — 보수적). 하나만 통과하면 그것"
none = """
둘 다 통과 못 하면 σ 는 EWMA 그대로다. 서버 · 화면 무변경. DVOL 은 매일 수집만 계속하고
라이브 표본(등록 뒤 날들)으로만 `dvol-sigma@2` 를 다시 등록할 수 있다 — 같은 과거 표본으로 후보를 바꿔 재등록하지 않는다.
"""
adopted = """
통과한 후보가 있으면 BTC · ETH 목표 비중의 σ 를 그 값으로 바꾼다(알트 · 다른 화면의 σ 는 EWMA 그대로).
화면 3종 고지의 과거 성적은 **그 규칙으로 다시 돌린 기록**(DVOL 기간만, 2022~)으로 바꾸고 기간이 짧아졌다고 적는다.
"""

[exploratory]
# 판정에 쓰지 않는다 — 리포트에만
raw_dvol = "보정 없는 DVOL/100 을 σ 로 쓴 ΔQLIKE(위험 프리미엄만큼 지는 것이 기대)"
horizon_30 = "지평 30일(RV30) ΔQLIKE — DVOL 만기와 같은 지평"
direction = """
시계열 스피어만: DVOL 수준 · IV−RV 스프레드(DVOL/100 − σ_ewma) · DVOL 7일 변화 vs 앞으로 7 · 30일 BTC(ETH) 로그수익.
리서치 기대는 0. 블록 부트스트랩 95% CI 만 적고 판정 · 규칙 반영 없음
"""
regime_split = "BTC 종가 vs 200일 이동평균 위 · 아래로 나눈 ΔQLIKE"
