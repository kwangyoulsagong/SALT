# 사전등록 — 네이버 검색 관심 급증이 다음 주 수익을 말해 주나 (F010 슬라이스 6 3차 · FC-REQ-017)
#
# 이 파일은 **데이터랩 첫 요청 전에** 커밋한다(키도 아직 없다). 커밋 시각 · 해시가 등록 증거다.
# 등록 뒤 신호 · 지평 · 판정 조건을 바꾸려면 새 키(`search-interest@2`)로 새 파일을 만든다 — 덮어쓰지 않는다.
#
# 배경: 리서치 §7-4 — 검색 관심이 늘면 1~2주 뒤 수익이 양(+)(Liu-Tsyvinski, Google Trends), 알트는 관심 급증 뒤 반전이
# 우세 [중]. 국내 개인 비중이 큰 업비트에는 네이버 검색이 더 가까운 원천이다. 이 등록은 두 주장을 업비트 원화 시세로 잰다.

key = "search-interest@1"
registered = 2026-10-06

[data]
source = """
네이버 데이터랩 검색어트렌드 POST /v1/datalab/search, timeUnit=date, 키워드 하나 = 요청 하나(묶음 하나 · 키워드 하나).
키워드 = 업비트 원화 마켓 한글명에서 괄호 부분을 뗀 것("엑스알피(리플)" → "엑스알피"). 일상어와 같은 이름
(domain/news_text.py _AMBIGUOUS_KO)은 받지 않는다. BTC = "비트코인".
백필 2016-01-01 ~ 받은 날 전날, 키워드마다 한 요청. 증분은 앞 60일을 겹쳐 받아 겹친 날 비의 중앙값으로 이어 붙인다
(domain/search_interest.py chain_link — 28일 미만 겹침이거나 비가 흩어지면 그날은 쌓지 않는다).
응답에 없는 날은 0(요청 구간 안에서만).
"""
times = "observed_at = 그날 00:00 KST, available_at = observed_at + 48시간(공개 시각 미상 — 보수 추정)"
prices = "업비트 원화 일봉 forecast.price_bar(upbit, 1d), 봉 경계 UTC 자정"
survivorship = """
지금 상장된 종목만 받는다 — 상장폐지 종목은 수집하지 않는다(사용자 결정 2026-09-29). 생존 편향은 H2 를 좋게 만든다(망한 종목의
마지막 급등 · 폭락이 빠진다). 그래서 H2 통과 기준을 BY-FDR 로 보정한 단측 상한으로 둔다. 리포트에 표본 선택 방식을 적는다
"""

[protocol]
grid = "매주 월요일 00:00 UTC 마감 봉 t, 2016-03-07 부터 마지막 결과가 있는 주까지. 비겹침 주 단위"
signal = """
spike_i[t] = ln(최근 7일 평균 ÷ 그 앞 28일 평균) — available_at ≤ t 인 마지막 날까지(domain/search_interest.py spike).
앞 28일 평균 < 0.5(지수 단위)면 결측. 수준 값은 쓰지 않는다(요청 배율이 약분되는 비율만 — 백필 배율의 미래 최댓값이 들어가지 않는다)
"""
h1 = """
BTC 시계열. y[t] = ln(BTC 종가[t+7일] / 종가[t]). IC = 스피어만(spike_BTC, y), 결측 주 제외. **양측** —
선행 연구는 양(+)이지만 국내 개인 검색은 고점 신호일 수도 있다
"""
h2 = """
알트 횡단면 반전. 주마다 alt_universe(t) = target-weight@1 정의(t 기준 상장 60일 이상 · 최근 30일 원화 거래대금 상위 10,
BTC · ETH 제외, 가격 기록이 있는 종목만). y_i[t] = 알트 7일 로그수익 − BTC 7일 로그수익.
그 주 spike 가 있는 종목이 5개 이상인 주만, 주별 스피어만(spike_i, y_i) → 주 평균 IC. **단측 — 기대 부호 음(−)**
"""
ci = "주 단위 이동 블록 부트스트랩 — 블록 4주 · 2000회 · seed 20261006. H1 분위 [2.5%, 97.5%], H2 상한 97.5%"
multiplicity = "H1 · H2 두 검정에 BY-FDR q = 0.10"
min_weeks = 104

[decision]
at_result = """
H1: 보정 뒤 CI 가 0 을 포함하지 않으면 '근거 있음' — 부호 · 크기 · 2017 · 2021 고점 구간 기여를 리포트에 적는다.
H2: 보정 뒤 상한 < 0 이면 '근거 있음'.
**규칙 · 화면은 이 결과로 바로 바꾸지 않는다.** 판정 점수나 목표 비중에 쓰려면 이 결과를 근거로 새 등록
(mode-decision@3 · target-weight@3)을 결과 전에 만들고 그 판정을 거친다. 둘 다 근거 없음이면 증분 수집은 끄고(하루 수백 요청)
백필만 남긴다 — 다시 켜는 것은 새 등록과 함께.
결과 뒤 창 · 지평 · 임계를 바꿔 다시 돌리지 않는다.
"""

[exploratory]
horizon_14d = "y 를 14일로(2주 비겹침 격자)"
eth = "ETH(\"이더리움\") 시계열 H1"
alt_level_cap = "H2 를 알트 시가총액 상위 5 만"
recent = "2021-01 뒤만 — 업비트 원화 거래가 커진 뒤"
