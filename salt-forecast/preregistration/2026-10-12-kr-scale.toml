# 사전등록 — 국내 주식 척도 · 형태 · 보정 도전자 (F011 슬라이스 5c P2 · FC-REQ-020 FR-11 ~ FR-15)
#
# 이 파일은 **도전자를 한 번도 돌려 보기 전에** 커밋한다. 커밋 시각 · 해시가 등록 증거다.
# 등록 뒤 창 · 피처 · 버킷 수 · 판정 조건을 바꾸려면 새 키(`kr-scale@2`)로 새 파일을 만든다 — 덮어쓰지 않는다.
#
# 배경: P1(2026-10-12) `kr-universe@1` 에서 챔피언 `kr-ens-baseline@0.2.0`(위치 0 + 종목별 경험 형태)이 기준
# `kr-rw-normal@0.1.0`(위치 0 · 1년 σ 정규)보다 **나쁘다**(d̄ −0.12 ~ −0.56%). 남은 표적 둘:
# 1) σ̂ 낮음 3분위 위 꼬리 7% · 높음 3.5% — 1년 단일 창 척도가 변동성 평균 회귀를 못 따라간다(척도)
# 2) 종목별 2년 경험 형태가 정규보다 꼬리를 못 맞춘다(형태는 수천 종목에서 빌린다)
# 등록 시점까지 아래 도전자로 계산한 결과 0회.

key = "kr-scale@1"
registered = 2026-10-12
universe = "kr-universe@1"         # P1 그대로 — 바꾸지 않는다
baseline = "kr-rw-normal@0.1.0"     # 이겨야 할 상대(FR-15)

[common]
location = "0 — 중앙값 0 · 상승 확률 0.5(FR-6). 모든 도전자 공통"
horizon_target = "h주 = 5h 거래일. 척도 단위 = 일 분산 예측 × 5h"
fit = """
척도 회귀는 **종목 풀링 하나**(종목별 계수 금지). as_of t 의 계수는 주 격자 g 중 라벨이 t 이전에 끝난(label_end(g, h) ≤ t)
최근 156주의 (g, 그때 유니버스 종목) 행으로 OLS. 행 < 26주 분량이면 전망 없음(None). 기간 h 마다 따로 적합.
목표 = log(기간 안 5h 거래일 일 수익률 제곱 평균). 예측 = exp(적합값) × 평균 exp(잔차)(Duan 스미어링).
"""
daily_return = "종가 대 종가 로그수익률. 결측 거래일(정지)은 결측 — 창 안 관측 80% 미만이면 그 피처 결측 → 그 행 없음"
floor = "일 분산 하한 1e-8(로그 전)"

[challengers]
# 누적 4단계. 판정 대상은 마지막 하나뿐이다 — 나머지 셋은 어느 성분이 기여했는지 보는 절제(ablation) 표로만 쓴다.
# 그래서 다중 비교는 Holm 4기간 그대로(도전자 수로 더 나누지 않는다). 실험 수 = 4 를 리포트에 적는다.
a1 = { version = "kr-har@0.1.0", scale = "HAR 종가 창 1주(5) · 1개월(21) · 3개월(63) · 12개월(250) + 시장 1개월(21)", shape = "정규", calibration = "풀링 CQR(지금 그대로)" }
a2 = { version = "kr-har-range@0.1.0", scale = "a1 + 범위 창 1주(5) · 1개월(21)", shape = "정규", calibration = "풀링 CQR" }
a3 = { version = "kr-har-fhs@0.1.0", scale = "a2", shape = "패널 FHS — σ̂ 3버킷별 표준화 잔차 분위수, 중앙값 빼서 위치 0", calibration = "풀링 CQR" }
challenger = { version = "kr-har-mondrian@0.1.0", scale = "a2", shape = "a3", calibration = "σ̂ 3버킷 Mondrian CQR — 버킷 풀 < 50 이면 풀링 조정량" }

[features]
range = "일 범위 분산 = 밤사이 ln(시가/전일 종가)² + Rogers–Satchell ln(H/C)ln(H/O) + ln(L/C)ln(L/O). 창 평균"
market = """
시장 일 수익률 = 그날 거래대금(종가 × 거래량) ≥ 10억 원인 종목의 종가 로그수익률 동일가중 평균(±30% 밖 버림).
KOSPI 지수 일봉이 DB 에 없어 대용한다(보고서 권고 13 의 'KOSPI 실현변동성' 이탈 — 리포트에 적는다). 같은 날 종가만 쓴다
"""
buckets = "σ̂(예측 일 분산) 3분위 — 경계는 그 as_of 적합 행의 σ̂ 3분위수(시점 고정). 4 · 5 버킷은 시도하지 않는다"
not_tried = "VKOSPI(원천 미확인) · 상/하한 마감일 검열 · ACI · NexCP · GARCH — 이번 등록 밖. 다음 등록에서 새 키로"

[protocol]
gate = "FC-REQ-020 P0 그대로 — 기준 대비 주별 단면 d̄_t, 최근 104주, HLN-DM · 블록 부트스트랩 · 비중첩 셋 다, 4기간 Holm α 0.05"
placebo = "8주 날짜 블록 맞바꾸기 200회 — 거짓 발견 비율(귀무 평균 ÷ 관측) ≤ 20%"
qlike = "척도만 따로: 손실 r²/σ̂² + ln σ̂²(r = h주 실현 수익률, σ̂ = 보정 전 척도). 기준 대비 주별 평균 차이 · 블록 부트스트랩 95%. 참고(판정 아님)"
coverage = "꼬리별 · σ̂ 3분위별 커버리지 — 참고(판정 아님)"

[decision]
pass = "도전자가 풀링 통과 기간이 있고 플라시보 ≤ 20% 면 `KR_PRODUCTION` 을 도전자로 바꾼다(매일 작업 · 게이트도). 카드 화면은 별 슬라이스"
fail = """
통과 기간이 없으면 챔피언 `kr-ens-baseline@0.2.0` 그대로 · 카드 0. 절제 표에서 한 단계(a1 ~ a3)가 통과처럼 보여도 바꾸지 않는다
— 판정 대상이 아니었다. 창 · 버킷 · 피처를 바꿔 다시 재지 않는다(그건 `kr-scale@2` 새 등록)
"""
