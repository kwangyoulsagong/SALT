[[condition]]
id = "ALL"
market = "crypto"
text = "평소 — 대상 전체 시각(정각 칸)"
horizons = [1, 4]
kind = "usual"

[[condition]]
id = "CM1S"
market = "crypto"
text = "작은 코인이 30분에 3% 넘게 오름"
rule = "r30_t >= ln(1.03) and size = small"
horizons = [1, 4]
kind = "test"

