# 사전등록 — 목표 비중 안내의 알트 몫 · 모델 포트폴리오 라이브 채점 (F010 · FC-REQ-013)
#
# 이 파일은 **결과를 보기 전에** 커밋한다. 커밋 시각 · 해시가 등록 증거다.
# 등록 뒤 규칙 · 지표 · 판정 조건을 바꾸려면 새 키(`target-weight@3`)로 새 파일을 만든다 — 덮어쓰지 않는다.
# `jobs/target_weight_v2` · `jobs/target_weight_live` 가 이 파일을 `forecast.preregistration` 에 한 번 쓰고,
# 같은 키에 다른 내용이면 실패한다.
#
# 배경: `target-weight@1`(`766e08d`) 에서 알트 10개를 core 와 같은 규칙으로 섞은 묶음(core_alts)은 모든 목표 σ 에서
# 평균 비중 고정보다 나빴다(ΔCalmar CI 전부 음, CAGR ≈ 0). 그런데 서버는 보유 알트에도 같은 규칙으로 비중을 준다
# (FEATURE-010 OQ 5). 이 등록은 (1) 알트에 **위험 몫 상한**을 둔 규칙이 core 만보다 나은지를 판정하고 —
# 통과 못 하면 알트에는 목표 비중을 주지 않는다 — (2) core 모델 포트폴리오를 등록 뒤부터 매주 불변 원장으로 채점한다.
# 이번에는 **판정이 있다**(@1 과 다름): [alt_share.adopt] 가 서버 규칙을 정한다(사용자 결정 2026-09-29).

key = "target-weight@2"
registered = 2026-09-29
supersedes = "target-weight@1 [universes] core_alts — 화면 규칙에서 알트를 core 와 같은 규칙으로 섞지 않는다"

[question]
text = """
1. 알트에 목표 σ 의 일부(위험 몫 a)만 떼어 주는 규칙이, 알트 없이 BTC · ETH 만 쓰는 규칙(a = 0)보다 나았나
2. 등록 뒤 매주 서버와 같은 규칙으로 정한 BTC · ETH 목표 비중을 실제로 따랐다면 어땠나(라이브)
"""

[protocol]
# @1 [protocol] 과 같다 — 기간 · σ · 리밸런스 · 비용 · 현금 · 수익 정의를 바꾸지 않는다
same_as = "target-weight@1 [protocol]"
period = "2018-01-01 ~ 실행일 전날(@1 과 같은 창)"

[alt_share]
rule = """
두 묶음으로 나눠 따로 계산하고 더한다. T = 목표 σ, a = 알트 위험 몫.
core 비중 = target_weights(σ_BTC·ETH, T × (1 − a), 상한 0.6)    — @1 과 같은 함수
알트 비중 = target_weights(σ_알트들, T × a, 상한 0.6)            — 알트끼리 역변동성
합 σ(상관 1 상한) ≤ T. a = 0 이면 @1 core 와 같다(비교 기준).
"""
candidates = [0.10, 0.20]
reference = 0.0
alt_universe = "@1 core_alts 알트와 같다 — 리밸런스 날 t 기준 상장 60일 이상 · 최근 30일 원화 거래대금 상위 10(BTC · ETH 제외)"
survivorship = """
상장폐지 종목은 수집하지 않는다(사용자 결정 2026-09-29). 업비트 원화 일봉 290종목 전부 현재 상장이다(같은 날 확인).
그래서 생존 편향이 남고, 알트 쪽에 유리하게만 작용한다 — 그래서 통과 기준을 다중 비교 보정 CI 하한 > 0 으로 엄격하게 둔다.
통과해도 리포트 · 화면에 '상장폐지 종목이 빠진 기록'을 같이 적는다.
"""
targets = [0.10, 0.15, 0.20, 0.30, 0.50]
primary_target = 0.15   # 서버 DEFAULT_TARGET_VOLATILITY

[alt_share.metric]
delta_calmar = "Calmar(a) − Calmar(a = 0). 일 수익 쌍 이동 블록 부트스트랩, 블록 30일 · 2000회 · seed 20260929(@1 과 같은 추출)"
multiplicity = "후보 2개 — Bonferroni: 양측 CI 를 [1.25%, 98.75%] 분위로 잰다"
also_reported = "ΔMDD(a − 0) · ΔCAGR · 상승 포착 · 하락 포착 — 판정에 쓰지 않는다"

[alt_share.adopt]
pass = """
후보 a 는 아래 둘을 **모두** 만족해야 통과한다.
(1) primary_target(0.15) 에서 ΔCalmar(a − 0) 의 98.75% CI 하한 > 0
(2) targets 5개 전부에서 ΔCalmar(a − 0) 점추정 > 0
"""
choose = "둘 다 통과하면 작은 a(보수적). 하나만 통과하면 그것"
none = """
둘 다 통과 못 하면 **알트에는 목표 비중을 주지 않는다.** 서버는 보유 알트를 목표 비중 계산에서 빼고
'기록이 뒷받침하지 않아 목표 비중이 없음'으로 알린다(부족 · 초과를 만들지 않는다 — 목표 0 을 '초과'로 부르면 매도 지시가 된다).
core(BTC · ETH) 규칙 · 기록은 @1 그대로다.
"""

[live]
what = "등록 뒤 첫 리밸런스부터 매주, core(BTC · ETH) × targets 5개 목표 비중을 불변 원장에 쓰고 한 주 뒤 결과를 쓴다. 알트 후보가 통과하면 그 a 의 core_alts 도 같은 방식으로 쓴다"
start = "2026-10-05T00:00:00Z — 등록 뒤 첫 월요일 00:00 UTC 에 마감한 봉"
weights = "리밸런스 날 t 에 @1 [rule] 과 같은 식(σ = labels.ewma_sigma, t 종가까지). 서버 targetWeights 와 같은 고정 벡터"
recorded = "비중 행은 계산 즉시 쓴다(recorded_at). recorded_at > t + 24h 인 주는 late — 원장에 남기되 라이브 성적에서 뺀다"
outcome = """
t+7일 봉이 마감한 뒤 한 번 쓴다. 주간 단순수익 R_i = close[t+7] / close[t] − 1(종목별),
전략 주간 수익 = Σ w_i R_i − 비용(리밸런스 비용 = 0.05% × Σ|w_새 − w_지난주가 흘러간 값|), 로그로 저장.
주 안에서는 매수 후 보유 — 매주 리밸런스 포트폴리오의 주간 수익은 이 식과 정확히 같다.
봉이 빠진 종목이 있는 주는 missing_bar 로 적고 성적에서 뺀다(0 으로 채우지 않는다).
"""
immutable = "비중 행 · 결과 행 둘 다 UPDATE 트리거 금지. 다시 계산한 값이 저장값과 다르면 작업이 실패한다(봉 보정 감지)"

[live.metrics]
# 라이브 성적은 기술(記述)이다 — CI 를 붙인 비교 문장을 쓰지 않고 같은 기간 숫자를 나란히 쓴다
n_weeks = "late · missing_bar 가 아닌 주 수"
cum_return = "전략 누적 단순수익"
btc_cum_return = "같은 주들 BTC 보유 누적 단순수익"
mdd = "주간 누적 곡선 최대 낙폭(전략 · BTC 둘 다)"
vol = "주간 로그수익 σ × √52"
upside_capture = "BTC 주간 로그수익이 양인 주들의 전략 합 / BTC 합"
downside_capture = "음인 주들에 대해 같은 식"
worst_weeks = "전략 주간 수익 하위 3주 — 실패 사례, 선별 없이"

[live.display]
min_weeks = 30
before = "n_weeks < 30 — 과거 성적은 백테스트(@1 core) 그대로, '라이브 채점 중 n/30주' 를 같이 쓴다"
after = "n_weeks ≥ 30 — 과거 성적 자리를 라이브 숫자로 바꾸고 백테스트는 '백테스트' 라벨로 아래에 둔다. 섞지 않는다"
first_check = "2027-05-03 전후(30주) — 그 전에는 라이브 숫자로 어떤 문장도 쓰지 않는다"

[exploratory]
items = [
  "알트 상위 3(거래대금) — 보유 알트가 몇 개뿐인 사용자에 가까운 묶음",
  "a = 0.05",
]
