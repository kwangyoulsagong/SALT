# 사전등록 — 국내 주식 척도 2차: 형태 없는 범위 HAR 를 판정 대상으로 + ACI · 분산비 절제 (F011 슬라이스 5c P3 · FC-REQ-020 FR-11 · FR-13 · FR-15)
#
# 이 파일은 아래 **새 절제 둘을 한 번도 돌려 보기 전에** 커밋한다. 커밋 시각 · 해시가 등록 증거다.
# 등록 뒤 창 · γ · 판정 조건을 바꾸려면 새 키(`kr-scale@3`)로 새 파일을 만든다 — 덮어쓰지 않는다.
#
# 배경: `kr-scale@1`(2026-10-12) 판정 대상 `kr-har-mondrian@0.1.0` 이 1 · 2주만 통과해 챔피언이 됐다. 3 · 4주는 패널 FHS
# 형태가 꼬리를 기울여(위 4% · 아래 6~8%) 미통과. 절제 표에서 형태 없는 `kr-har-range@0.1.0` 이 4기간 모두 통과했다
# (최근 104주 d̄ +1.95 · +1.67 · +1.31 · +1.15%, HLN p 0.000 ~ 0.000).
#
# **정직하게 적는다**: 이번 판정 대상의 최근 104주 결과는 이미 봤다 — 넷 중 가장 좋은 걸 골랐다(선택 편향).
# 그래서 같은 창의 통과만으로는 바꾸지 않는다. 아래 [decision] 의 셋을 전부 요구한다:
#   1) 선택 보정 — 시도한 구성 수(4)로 α 를 나눈다(0.05 / 4 = 0.0125, 기간 4개 Holm 은 그 안에서)
#   2) 이전 창 — `kr-scale@1` 판정에 쓰지 않은, 최근 104주 **앞**의 주들(도전자 전망이 있는 주 전부, 최대 104)에서도 이긴다.
#      이 창의 단면 표는 본 적이 없다. 단, 전체 기간 평균 pinball 표(리포트 첫 표)는 봤다 — 완전한 미관측은 아니다
#   3) 플라시보 거짓 발견 ≤ 20%(지금 규칙 그대로)
# 진짜 밖 표본은 2026-10-12 이후 라이브 주다 — 26주(2027-04 경) 채점을 별 확인으로 남긴다(판정 아님).

key = "kr-scale@2"
registered = 2026-10-20
universe = "kr-universe@1"
baseline = "kr-rw-normal@0.1.0"
champion = "kr-har-mondrian@0.1.0"   # 지금 운영 — 1 · 2주 카드
supersedes_note = "kr-scale@1 은 그대로 둔다(덮어쓰지 않는다). 이 등록은 새 판정 하나와 새 절제 둘"

[challenger]
version = "kr-har-range@0.1.0"      # kr-scale@1 의 a2 와 같은 계산 — 모델 버전은 계산의 이름이라 바꾸지 않는다
scale = "풀링 HAR 종가 5 · 21 · 63 · 250 + 범위 5 · 21 + 시장 21, 로그 OLS, Duan 스미어링, 156주 적합(kr-scale@1 [common] 그대로)"
shape = "정규"
calibration = "정규화 풀링 CQR(버킷 없음)"

[ablations]
# 판정 대상 아님 — 처음 재는 것. 결과가 좋아도 이 등록으로 바꾸지 않는다(새 키로 다시 등록해야 한다)
aci = { version = "kr-har-range-aci@0.1.0", base = "challenger", what = """
적응 보정(ACI, Gibbs & Candès 2021)의 풀링 판. 구간 셋(90 · 80 · 50%)마다 α_k 를 따로 둔다. 시작 α = 명목.
주 격자 j 의 라벨이 끝나면(label_end(j, h) ≤ as_of) 그 주 단면의 이탈 비율 err_j(그 주에 실제로 낸 보정 구간 밖 비율)로
α ← clip(α + γ(α* − err_j), 0.005, 0.5), γ = 0.05. 주 j 는 격자 순서대로 한 번씩만 넣는다.
as_of 의 조정량 = 라벨 끝난 최근 52주 풀의 정규화 점수 분위수 ⌈(m+1)(1−α)⌉/m — 지금 CQR 에서 명목 대신 α 만 바뀐다.
기간 h 마다 따로. 엠바고는 그대로(라벨 끝 ≤ as_of 인 주만 α 에 들어간다)
""" }
variance_ratio = { version = "kr-har-range-vr@0.1.0", base = "challenger", what = """
Duan 스미어링 대신 h주 분산비 c_h = 평균(ret² ÷ (exp(적합값) × 5h)) — 적합 행의 실현 h주 수익률로 척도를 맞춘다.
목적: 범위 계열 QLIKE 가 기준보다 나쁜 원인(보정 전 척도 치우침 가설) 확인. CQR 이 척도 상수배를 대부분 흡수하므로
pinball 은 도전자와 거의 같을 것으로 예상 — QLIKE 표가 이 절제의 본 결과
""" }

[protocol]
gate = "FC-REQ-020 P0 그대로(HLN-DM · 블록 부트스트랩 · 비중첩 셋 다) — α 0.0125, 4기간 Holm"
recent_window = "최근 104주(kr-scale@1 과 같은 창)"
earlier_window = "최근 104주 앞, 도전자 · 기준 짝이 있는 주 전부 중 마지막 104주. 같은 세 검정 · α 0.0125 · Holm"
placebo = "8주 날짜 블록 맞바꾸기 200회 — 최근 창 풀링 게이트 + 종목 거부권, 거짓 발견 ≤ 20%"
qlike = "참고 — 기준 대비 주별 평균 차이 · 블록 부트스트랩 95%"
coverage = "참고 — 꼬리별 · σ̂ 3분위별"
experiments = "누적 실험 수 = kr-scale@1 의 4 + 이번 절제 2 = 6. 리포트에 적는다"

[decision]
pass_horizon = "기간 h 통과 = 최근 창 통과(α 0.0125) **그리고** 이전 창 통과(α 0.0125)"
switch = """
도전자 통과 기간 집합이 챔피언의 통과 기간(지금 1 · 2주)을 **모두 포함하고 더 많으면** `KR_PRODUCTION` 을 도전자로 바꾼다
(매일 작업 · 게이트도), 플라시보 ≤ 20% 일 때만. 아니면 챔피언 그대로. 챔피언도 같은 α 0.0125 · 두 창으로 다시 재서
리포트에 싣는다 — 챔피언이 이 기준을 못 넘는 기간이 있으면 그 사실을 적는다(이 등록으로 챔피언을 끄지는 않는다 —
지금 운영 게이트는 kr-scale@1 규칙이 정한다)
"""
fail = "바꾸지 않는다. 창 · α · 형태를 바꿔 다시 재지 않는다(그건 kr-scale@3)"
