# 사전등록 — 밸류에이션 밴드 적립이 같은 돈의 정액 적립보다 나은 주를 골랐나 (F003 v2 순서 1 · FC-REQ-029)
#
# 이 파일은 **결과를 보기 전에** 커밋한다. 커밋 시각 · 해시가 등록 증거다.
# 등록 뒤 지표 · 밴드 · 관문 · 실패 사례 기준을 바꾸려면 새 키(`band-accumulation@2`)로 새 파일을 만든다 — 덮어쓰지 않는다.
# `jobs/accumulation_band` 가 이 파일을 `forecast.preregistration` 에 한 번 쓰고, 같은 키에 다른 내용이면 실패한다.
#
# 등록 시점까지 본 값: 코스피 PER 월값 분포(2004-01 ~ 2026-09 — 중앙 14.3 · 하위 20% 11.3 · 상위 5% 24.4 · 2020-03 14.7 ·
# 2021-01 30.6 · 2026-09 11.4) · BTC MVRV 최근 세 점(2026-11-15 ~ 17 약 1.21) · 원천 연결 확인용 시가총액 · 가격 몇 점.
# 밴드 적립 성적(아래 [metrics]) 계산은 0회다. 밴드 경계 · 배수는 2026-09 기획서(FEATURE-003 FR-2 · FR-4)의 것을 그대로 옮겼다 —
# 성적을 보고 고른 값이 아니다.

key = "band-accumulation@1"
registered = 2026-11-19

[question]
text = """
매주 같은 기본액에 밸류에이션 밴드 배수를 곱해 사면(밴드 적립), 그 주 매수의 52주 뒤 수익률을 배수로 가중한 평균이
같은 주들을 똑같이 산 정액 적립의 평균보다 높은가. 자산마다(BTC · 코스피) 따로 묻는다.
높다는 것이 아래 관문을 지나면 그 자산의 배수를 화면에 켠다. 아니면 배수 1.0(정액)과 "밴드 효과 미검증"을 보인다.
"""
why_not_cost = """
평균 매수 단가 비교는 쓰지 않는다 — 가격과 반대로 사는 어떤 규칙도 평균 단가를 낮춘다(쌀 때 더 사니까). 그건 밴드가 미래 수익이 높은 주를
골랐다는 증거가 아니다. 52주 뒤 수익률을 배수로 가중하면 배수가 미래 수익과 같이 움직일 때만 이긴다.
"""

[data]
btc = """
Coin Metrics Community `timeseries/asset-metrics` asset = btc, frequency = 1d — CapMVRVCur(시가총액 ÷ 실현 시가총액) · CapMrktCurUSD(시가총액) ·
PriceUSD. 행 시각 time 은 그날(UTC) 00:00, available_at = time + 2일(onchain-regime@1 과 같은 보수 규칙).
라이선스 CC BY-NC 4.0 — 비상업 · 출처 표기 조건으로 화면 표시(security-sources.md 표 개정 2026-11-19)
"""
kospi = """
한국은행 ECOS 901Y014(주식시장 월) 1110000 KOSPI 주가이익비율 · 1100000 배당수익률(표시만), 2004-01 ~.
발표 시각이 응답에 없다 → available_at = 그 달 말일 + 50일(2026-11-19 에 2026-09 가 보이고 2026-10 은 없다 — 9월 30일 + 50일 = 11월 19일).
ECOS 802Y001(주식시장 일) 0001000 KOSPI 지수 — available_at = 그 거래일 다음 날 00:00 UTC(09:00 KST)
"""
labels = "수익률 라벨의 가격 — BTC PriceUSD(관측일 값), 코스피 지수(관측일 종가). 라벨은 판단에 쓰지 않는다(52주 뒤에만 채점)"

[protocol]
decision_days = "매주 월요일 00:00 UTC. 그 시각에 available_at ≤ t 인 값만 쓴다"
horizon = "52주(364일). 라벨 r[t] = P(t + 364일) ÷ P(t) − 1, P(t) = t 직전 관측일 가격(BTC 전날 · 코스피 마지막 거래일 종가)"
closed = "평가 시각 T 에서 쓰는 표본 = t + 364일 ≤ T 이고 그 라벨 가격의 available_at ≤ T 인 주만(확장 창 워크포워드 — 미래 0)"

[indicator.btc]
name = "mvrv_z"
value = """
Z[t] = (MC − MC ÷ MVRV) ÷ sd(MC) — MC · MVRV 는 available_at ≤ t 인 가장 최근 관측일 값,
sd 는 2010-07-18 ≤ observed ≤ 그 관측일 인 MC 일값들의 표본 표준편차(확장 창). 표본 365일 미만이면 값 없음.
마지막 관측이 t − 7일보다 오래됐으면 값 없음
"""
bands = [
  { key = "extreme_low", below = 0.0, multiplier = 3.0 },
  { key = "low", below = 2.0, multiplier = 2.0 },
  { key = "neutral", below = 5.0, multiplier = 1.0 },
  { key = "high", below = 7.0, multiplier = 0.5 },
  { key = "extreme_high", below = "inf", multiplier = 0.0 },
]

[indicator.kospi]
name = "per_percentile"
value = """
PER 추정[t] = PER[m] × K[t] ÷ K[m 말] — m 은 available_at ≤ t 인 가장 최근 달, K 는 available_at ≤ t 인 가장 최근 지수 일값,
K[m 말] 은 m 달 마지막 거래일 지수(이익이 m 달 뒤 그대로라고 보는 추정 — 화면에 "추정" 표시).
백분위[t] = (available_at ≤ t 인 PER 월값 중 ≤ PER 추정[t] 인 수) ÷ (그 월값 수). 월값 60개 미만이면 값 없음.
마지막 PER 달이 t 보다 100일 넘게 오래됐거나 지수가 t − 10일보다 오래됐으면 값 없음
"""
bands = [
  { key = "extreme_low", below = 0.20, multiplier = 3.0 },
  { key = "low", below = 0.50, multiplier = 2.0 },
  { key = "neutral", below = 0.80, multiplier = 1.0 },
  { key = "high", below = 0.95, multiplier = 0.5 },
  { key = "extreme_high", below = "inf", multiplier = 0.25 },
]

[metrics]
excess = "E = Σ m[t]·r[t] ÷ Σ m[t] − 평균 r[t] (닫힌 주 전부). 같은 주들을 똑같이 산 정액 대비, 원당 52주 수익률 차이(%p)"
ci = "52주 이동 블록 부트스트랩 2,000회(seed 20261119) — E 의 5% · 95% 분위가 90% 구간"
by_year = "달력 연도별 E — 그 해에 결정한 주만. 리포트 · 화면 보조(양수 연도 수 / 연도 수)"
cost_info = "원당 매수 수량(평균 단가 역수) 비교 — 리포트에만, 판정에 안 쓴다(why_not_cost)"

[gate]
pass = "닫힌 주 ≥ 260 이고 E 의 90% 구간 하한 > 0"
blocked = [
  { reason = "insufficient_sample", when = "닫힌 주 < 260" },
  { reason = "not_better_than_flat", when = "90% 구간 하한 ≤ 0" },
  { reason = "stale_inputs", when = "t 의 지표 값 없음(위 신선도)" },
]
fallback = "관문을 못 지나면 그 자산의 화면 배수 = 1.0(정액). 밴드 · 지표 · 성적 · 실패 사례는 그대로 보인다(숨기지 않는다)"

[failure_cases]
rule = """
닫힌 주 중 밴드가 틀린 쪽으로 기운 주: ① 싸다(m ≥ 2)였는데 r ≤ cheap_loss ② 비싸다(m ≤ 0.5)였는데 r ≥ expensive_gain
③ 중립 이상(m ≥ 1)이었는데 r ≤ missed_drop. 같은 사례는 26주 안에 한 번만(가장 나쁜 주). 화면 · 뷰는 |r| 큰 순 3건 + 전체 수
"""
btc = { cheap_loss = -0.30, expensive_gain = 0.50, missed_drop = -0.50 }
kospi = { cheap_loss = -0.15, expensive_gain = 0.25, missed_drop = -0.25 }

[decision]
adopted = "자산마다 관문 통과면 화면 배수 = 밴드 배수. 매주 다시 판정한다(확장 창) — 사람이 켜는 플래그 없음"
report = "reports/band-accumulation-band-accumulation-1-<날짜>.md — 자산별 E · 90% 구간 · 연도별 · 원당 수량 · 실패 사례 · 표본 선택"
