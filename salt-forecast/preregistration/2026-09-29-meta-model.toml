# 사전등록 — 메타 모델 · 보정 · 확률 표시 자격 (F010 슬라이스 4 · FC-REQ-011)
#
# 이 파일은 **결과를 보기 전에** 커밋한다. 커밋 시각 · 해시가 등록 증거다.
# 등록 뒤 판정 규칙을 바꾸려면 새 키(`meta-model@2`)로 새 파일을 만든다 — 덮어쓰지 않는다.
# `jobs/meta_model` 이 이 파일을 `forecast.preregistration` 에 한 번 쓰고, 같은 키에 다른 내용이면 실패한다.

key = "meta-model@1"
registered = 2026-09-29
rule_version = "mode-decision@2"   # 1차 신호 = 지금 서버 규칙 점수(rule_items.contributions version=@2)

[question]
text = """
지금 규칙 점수(1차 신호)에 소수 피처를 더한 메타 모델이, 화면의 익절 계획(손절 −1σ · 1차 익절 +2σ · 20일)에서
"익절이 손절보다 먼저 닿을 확률"을 **보정된 확률**로 낼 수 있는가.
통과하면 확률을 매일 원장에 발행한다(화면 표시는 아래 [live] 게이트를 라이브로 넘은 뒤). 못 넘으면 확률은 만들지 않고
지금처럼 규칙 점수 · 채점 성적만 보인다.
"""

[protocol]
universe = "업비트 원화 일봉 forecast.price_bar(upbit, 1d). as_of 마다 그 날 봉이 있고 첫 봉 뒤 60일이 지났고 EWMA σ 가 있는 종목"
grid = "주 격자 — 패널 시작 뒤 7일마다(행 번호 % 7 == 0) 의 as_of 만 학습 · 평가 행으로 쓴다(라벨 20일 겹침을 1/7 로 줄인다)"
as_of = "UTC 자정(일봉 마감). 피처는 행 t 까지(available_at <= as_of)만"
period = "2018-01-01 ~ 실행일 − 20일(라벨이 끝난 행만)"
label = """
y = 1 ⇔ 삼중 장벽(슬라이스 1 labels.triple_barrier, h = 20일 · 상단 +2σ_h · 하단 −1σ_h · σ = EWMA λ0.94) 이 +1.
하단 먼저 · 수직(둘 다 안 닿음) = 0. 같은 날 둘 다 닿으면 하단(labels.py 그대로).
장벽 재설정(리서치 §6-3 게이트 20~60%)은 하지 않는다 — 라벨은 서버 익절 계획(슬라이스 2 [stops])과 같은 정의여야
확률이 화면의 가격선에 대한 말이 된다. 양성 비율은 리포트에 적는다
"""
survivorship = "지금 상장 종목만 있다(상장폐지 원천 없음). 리포트에 적는다"

[features]
# 11개(리서치 §6-2 상한 8~12). 이름 · 정의 · 단조 제약(+1 증가 · −1 감소 · 0 없음)
rule_long = { def = "mode-decision@2 장기 총점 50 + 항목 합(0~100)", monotone = 1 }
rule_scalp = { def = "mode-decision@2 단타 총점", monotone = 1 }
mom_28d = { def = "ln(C[t−1] / C[t−28])", monotone = 0 }
rs_btc_5d = { def = "ln(C[t]/C[t−5]) − BTC 같은 값", monotone = 0 }
rs_btc_20d = { def = "ln(C[t]/C[t−20]) − BTC 같은 값", monotone = 0 }
vol_pct_365 = { def = "EWMA σ[t] 가 그 종목 직전 365행(t 포함) σ 중 몇 분위인가(0~1). 관측 < 120 이면 결측", monotone = 0 }
turnover_z_30 = { def = "ln(거래대금 V·C) 의 30행(t 포함) z. 표준편차 0 이면 결측", monotone = 0 }
drawdown_365 = { def = "C[t] / max(C[t−364..t]) − 1", monotone = 0 }
btc_trend = { def = "BTC C[t] > 200일 SMA → 1, 아니면 0, 200일 미만 결측", monotone = 0 }
hmm_p_high = { def = "BTC 2상태 HMM 고변동 forward 필터 확률 — 슬라이스 2 regime.hmm_monthly(월초 확장 창 · seed 20260929)", monotone = 0 }
funding_7d = { def = "바이낸스 무기한 펀딩비 (t−7일, t] 평균. 상장 안 된 종목은 결측", monotone = -1 }

[models]
# 넷 다 같은 행 · 같은 분할로 잰다. 시도 횟수 N = 4 (DSR 에 쓴다)
climatology = "학습 행 양성 비율 하나(상수 확률) — 모든 비교의 바닥"
rule_only = "L2 로지스틱, 피처 rule_long · rule_scalp 둘 — '규칙 점수만' 기준"
logistic = """
L2 로지스틱, 피처 11개. 결측은 학습 창 중앙값으로 채우고 결측 여부 열(funding_7d 만)을 더한다.
학습 창 평균 · 표준편차로 표준화. 벌점 λ = 1.0 (절편 제외), 뉴턴법 수렴 1e-8 · 최대 100회
"""
lgbm = """
LightGBM binary, 피처 11개(결측 그대로). num_leaves 8 · min_data_in_leaf 200 · learning_rate 0.05 · 200 라운드(조기 종료 없음)
· feature_fraction 0.8 · bagging_fraction 0.8 · bagging_freq 1 · extra_trees true · lambda_l2 1.0
· monotone_constraints 위 표 · monotone_constraints_method advanced · seed 20260929 · deterministic true · num_threads 1
"""

[cpcv]
# 모델 선택 · 신호 게이트 — 조합 퍼지드 교차검증(AFML 12장)
groups = 6
test_groups = 2          # C(6,2) = 15 분할 · 경로 5
split = "주 격자 날짜를 시간 순으로 6 등분(연속 구간)"
purge = "시험 구간 [a, b] 마다 학습 행 t ∈ [a − 20일, b + 20일] 제거(라벨 창 [t, t+20] 겹침)"
embargo = "추가로 t ∈ (b + 20일, b + 27일] 제거"
oos = "행마다 시험에 든 5개 분할의 예측 평균 = 풀링 OOS 확률"
auc_ci = "풀링 OOS AUC 의 날짜 이동 블록 부트스트랩 95% — 블록 6주(주 격자 6행 = 2h) · 2000회 · seed 20260929"
select = """
logistic 과 lgbm 중 하나: 행별 로그손실 차(lgbm − logistic)를 날짜별 평균 → 이동 블록 부트스트랩 CI 상한 < 0 이면 lgbm,
아니면 logistic(CI 안이면 단순한 쪽 — 리서치 §6-2)
"""
signal_gate = "선택 모델 AUC CI 하한 > 0.52 이고, 로그손실 차(선택 − rule_only) CI 상한 < 0"
shuffle_check = """
누수 점검: 라벨을 날짜 안에서 섞어(seed 20260929) 선택 모델을 같은 CPCV 로 → AUC CI 가 0.5 를 포함해야 한다.
포함하지 않으면(하한 > 0.5) 결과 전체 무효 — 판정하지 않고 원인부터 찾는다
"""

[walk_forward]
# 보정 · 표시 자격 — 라이브와 같은 절차를 과거에 그대로 돌린다
retrain = "4주마다(주 격자 4행). 학습 = t ≤ as_of − 20일 인 주 격자 행, 최근 4년(1460일), 최소 104주"
calibration = """
Beta 보정(Kull 2017): 재학습 시점마다 직전 52주 OOS (p_raw, y) 중 라벨이 as_of 전에 끝난 것으로
logit(p_cal) = a·ln(p) − b·ln(1−p) + c 적합. a 또는 b 가 음수면 그 항을 빼고 다시 적합(단조 유지).
풀 < 200 행이면 보정 없음 — 그 기간은 평가에서 뺀다. **Isotonic 금지**
"""
climatology = "비교 기준 = 같은 학습 창 양성 비율(그 시점에 알 수 있던 값). 전 기간 비율은 참고로만 적는다"
eval = "첫 보정이 생긴 주부터 끝까지의 OOS p_cal"
ece = "10 등빈도 구간 Σ (n_k/n) |mean p_k − mean y_k|"
brier = "Brier = REL − RES + UNC (같은 10 등빈도 구간 분해)"
bss = "1 − Brier_model / Brier_climatology. CI = 날짜 이동 블록 부트스트랩 6주 · 2000회 · seed 20260929"

[decision]
adopt = """
전부 만족: (1) CPCV signal_gate (2) shuffle_check 통과 (3) walk-forward ECE ≤ 0.05 (4) BSS CI 하한 > 0.
채택되면 선택 모델 · Beta 보정을 매일 돌려 확률을 원장에 쓴다(표시는 [live] 게이트 뒤)
"""
reject = "하나라도 못 넘으면 확률을 만들지 않는다. 규칙 점수 · 채점 성적만. 다음 기회는 새 키(피처 · 라벨을 바꾸면 새 등록)"

[live]
# 라이브 표시 게이트 — 서버가 이 조건을 넘은 확률만 화면에 보낸다. 지금 등록해 둔다(나중에 결과를 보고 정하지 않게)
min_settled = 200
max_ece = 0.05
bss = "라이브 BSS > 0 (같은 버전 · 라벨 끝난 행만)"
blocked_copy = "확률 표본 n/200"
first_look = 2026-11-23   # 원장 발행 + 8주. 그 전에는 라이브 성적을 보지 않는다

[secondary]
# 판정에 쓰지 않는 기록. 결과가 좋아도 채택 근거가 아니다
dsr = """
전략 참고: 매 주 격자 선택 모델 p_cal 상위 20% 동일가중 − 전체 동일가중의 7일 로그수익(주 1회, 겹침 없음, 수수료 왕복 0.1% 차감).
Sharpe · DSR(Bailey · López de Prado 2014, N = 4 · 시도 Sharpe 분산은 네 모델의 같은 전략 Sharpe 분산). 화면에 가지 않는다
"""
fdr_rule_ic = """
rule-ic@1 탐색표(forecast.rule_ic, backtest · regime all) 를 Benjamini–Yekutieli q = 0.05 로 다시 판정.
p 는 CI 에서 정규 근사(se = (hi − lo) / 3.92, 양측). 1차 판정은 바꾸지 않는다 — 탐색 중 몇 개가 살아남는지만
"""
fdr_symbol = """
종목별 walk-forward BSS > 0 단측 검정(날짜 이동 블록 부트스트랩 6주 · 2000회, p = 부트스트랩 BSS ≤ 0 비율) → BY q = 0.05.
통과 종목 수만 적는다. 종목별 '잘 맞음' 배지는 이 검정을 통과할 때만 만들 수 있다(이 슬라이스에서는 만들지 않는다)
"""
cross_section_auc = "날짜별 종목 간 AUC 평균 — 풀링 AUC 중 시장 전체 방향(시점) 몫을 뺀 것"
importance = "선택 모델 전 기간 적합의 계수(로지스틱) 또는 gain(lgbm)"
