# 사전등록 — 업비트 거래 유의 · 주의 표시의 라이브 기록 (F010 슬라이스 6 · FC-REQ-014)
#
# 이 파일은 **첫 수집 전에** 커밋한다. 등록 뒤 판정 조건을 바꾸려면 새 키(`market-warning@2`).
#
# 배경: 업비트 `/v1/market/all?is_details=true` 의 `market_event` 는 **지금 상태만** 준다 — 과거 이력이 없어서
# 백테스트 IC 를 잴 수 없다. 그래서 (1) 오늘부터 매일 스냅샷을 불변으로 쌓고 (2) 8주 뒤 라이브로 잰다.
# 판정 미발행 정책(유의 종목)은 이 결과와 무관하다 — 리서치 §11 · 사용자 결정 2026-09-30 의 정책이다.
# 업비트 공지 JSON 은 쓰지 않는다(사용자 결정 2026-09-23 — security-sources.md §1).

key = "market-warning@1"
registered = 2026-09-30

[data]
source = "업비트 공식 공개 API GET /v1/market/all?is_details=true — KRW- 마켓만"
fields = "market_event.warning(투자유의) · market_event.caution 5종(PRICE_FLUCTUATIONS · TRADING_VOLUME_SOARING · DEPOSIT_AMOUNT_SOARING · GLOBAL_PRICE_DIFFERENCES · CONCENTRATION_OF_SMALL_ACCOUNTS)"
