# 사전등록 — 단타 방향 확률 v5: 전진 시험 + 동결 재생(코드 가드 = 예측 코드 변경) (F017 v4 · FC-REQ-028 FR-1 · FR-4 · 2026-11-16)
#
# 이 파일은 @5 의 어떤 예측 · 결과보다 먼저 커밋한다. 바꾸려면 새 키(`short-direction@6`).
#
# ── @4 에서 고친 것(같은 날) ─────────────────────────────────────────
# @4 replay (2) 는 "model_version(커밋)이 같을 때만"이라 문서 · 서버 · 머지 커밋 하나에도 그 뒤 재생이 통째로 빠졌다
# (머지 직후 실측: 적합 a43a9df5 ≠ HEAD bfdcd201 — 그날 밤 · 주말 재생 0). → 그 사이 **예측 코드**가 바뀌었을 때만 막는다.
# @4 전진 행: 예측 147(실시간) · 채점 0 · 재생 0 — @5 표본에 넣지 않는다.
#
# ── 왜 @4 인가 ───────────────────────────────────────────────────────
# 2026-11-16 맥(유일한 서버)이 평일 업무 시간에만 켜지게 됐다(사용자 결정 — 포트폴리오 프로젝트라 배포하지 않고 한계로 둔다).
# @3 은 "기준 봉 마감 뒤 15분 안에 쓴 예측"만 표본이라, 코인 표본이 평일 KST 09~18시 발행분에만 쌓인다.
# 같은 walk-forward 를 시간대로 잘라 실측(2026-11-16, 판정 아님 · 결과 미열람 상태의 과거 검산)하면 판정 결론은 같지만
# 크기가 달라진다 — 1h BSS +0.0056 → +0.0037 · ECE 1.7배 · 4h BSS CI 가 0 을 걸침. 전 시간대 모집단을 되찾으려고 재생을 더한다.
#
# @3 전진 표본: 2026-11-16 14:00 KST 부터 예측 444행 · 채점 crypto 1h 약 98행(판정 통계는 아무도 계산 · 열람하지 않았다).
# 이 변경은 결과가 아니라 가동 시간 때문이다. @3 행은 @4 표본에 넣지 않는다.

key = "short-direction@5"
registered = 2026-11-16
supersedes = "short-direction@4"
same_as = "short-direction@4 — [forward] fit · predict · sample · sensitivity · replay (1)(3)(4) · 그리고 short-direction@3 — [cells] [protocol.*] [features] [model] [walk_forward] · 분위 · 무효선 · [forward] fit · [looks] dates · alpha · family · min_days · [decision] pass · display · report"

[forward]
fit = "@3 그대로 — 매일 시험 작업이 칸마다 마지막 블록 적합(원래 + 피처 없는 모델)을 저장한다(short_horizon_test.live_params, run_as_of 로 시각 고정)"
predict = "@3 그대로 — 시험 칸 전부(코인 1h · 4h · 1d 매시 · 국내 1d 거래일 16:00 뒤) 유니버스 종목마다 p · p_ref"
replay = """
동결 재생 — 실시간 기록 창(코인 기준 봉 마감 뒤 15분 · 국내 다음 거래일 09:00 전)을 놓친 기준 시각은 깨어난 뒤 다시 만든다.
(1) 입력: 그 시각 기준 active_cells(run_as_of ≤ 그 시각인 마지막 시험의 적합) · 그 시각까지 available_at 인 봉 — 실시간과 같은 함수(jobs/short_direction predict_at)
(2) 코드: 그 적합의 커밋 뒤 **예측 코드**(이 작업이 불러온 salt_forecast 모듈 파일 + pyproject · uv.lock)가 git 으로 바뀌지 않았을 때만. 바뀌었거나 알 수 없으면 그 시각은 비운다
(3) 고를 여지 없음: 등록 뒤 · 지금으로부터 14일 안 · 기록 창이 지난 기준 시각 **전부**(코인 정시 · 국내 개장일). 이미 쓴 행은 덮지 않는다
(4) 구분: 재생 행의 available_at = 실제로 쓴 시각 — 실시간 행과 언제든 가를 수 있다
"""
sample = "판정 표본 = 이 키로 쓴 예측(실시간 + 재생) 중 채점이 끝났고 기준 시각이 **판정 날짜 00:00 KST 전**인 것. 판정이 늦게 돌아도 표본이 같다. 다른 키 예측과 합치지 않는다"
sensitivity = "리포트에 '실시간 기록만' 같은 지표를 나란히 — 판정에 쓰지 않는다"

[looks]
dates = ["2027-01-10", "2027-02-09", "2027-03-11"]   # @3 과 같은 날짜(등록일을 다시 세지 않는다 — 가동 때문에 판정을 늦추지 않는다)
alpha_per_look = 0.0166667
family = "한 날짜 안 Holm — 그날 판정하는 칸들"
min_days = 30

[decision]
pass = "@3 그대로 (1) BSS Holm · CI 하한 > 0 (2) ECE ≤ 0.03 (3) 확신 행 ≥ 300 · (확신 적중 − 늘 많은 쪽) CI 하한 > 0 (4) '오름' 확신 ≥ 30 이면 비용 뒤 평균 > 0"
fail = "마지막 판정 날짜에 통과 못 하면 fail — 사유 = 처음 걸린 것 no_skill(1) > miscalibrated(2) > no_edge_confident(3) > cost(4). **날 < 30 이면 below_min**(@3 은 no_skill 로 적었다 — 표본 부족은 실력 판정이 아니다)"
