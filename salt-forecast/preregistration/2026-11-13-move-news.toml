# 사전등록 — H3 큰 움직임 × 소식 유무 × 거래량: 크게 움직인 다음은 이어지나 되돌리나 (F017 v4 순서 4 · FC-REQ-028 FR-9 H3)
#
# 이 파일은 **소식 유무로 나눈 움직임 뒤 결과를 한 번도 계산하기 전에** 커밋한다. 정의 · 문턱 · 지평을 바꾸려면 새 키(`move-news@2`).
# 사용자 2026-11-13 "2번은 ㄱㄱㄱ".
#
# 왜: 사람은 크게 오른 날 따라 사고(추격) 크게 내린 날 판다. 문헌은 "소식이 있는 큰 움직임은 이어지고 소식 없는 큰 움직임은 되돌린다"
# (Chan 2003 · 국내 선행 연구 소식 없음 −0.37% / 소식 있음 +0.78% — 리서치 B · E). 맞으면 패널의 "오늘 왜 움직였나" 다음 줄에
# "이런 움직임 뒤엔 보통 …"을 증명된 숫자로 쓸 수 있다.
#
# ── 자료 한계(등록 시점 실측 2026-11-13) ─────────────────────────────
# 국내 소식 제목(v_kr_news_title_export) = 2026-10-27 ~ 만 있다(31,864행 — news-reaction@1 의 '1년 백필'은 그 이전 행을 만들지 않았다).
# 코인 소식(forecast.news_item) = 2025-12-06 ~ 이지만 2026-10 전에는 한 원천 몇 건뿐. 그래서 **과거 판정 없음 — 전진 시험만**.
# 과거 구간 숫자는 리포트에 '참고(판정 아님)'로만.
# 소식이 '없음' = 우리가 모은 원천에 없음이다(세상에 없음 아님). 화면 · 리포트 문구가 이 차이를 지킨다.

key = "move-news@1"
registered = 2026-11-13

[question]
text = """
큰 움직임(|r_t| ≥ 2σ_t) 다음 1 · 5 봉의 '움직인 방향 기준 초과 수익' s = sign(r_t) · (r_{t+1..t+h} − 같은 시장 동일가중 평균)이
소식 있음 집단에서 > 0(이어짐) · 소식 없음 집단에서 < 0(되돌림)인가. 그리고 두 집단의 차이 > 0 인가.
거래량(평균 2배 이상 · 미만)은 나눠서 서술하고, 검정은 위 셋만.
"""

[protocol]
kr_source = "forecast.price_bar kis 1d · 유니버스 kr-universe@1 · 끊김 제외 — base-rate@1 과 같다"
crypto_source = "forecast.price_bar upbit 1d · 유니버스 base-rate@1 crypto_universe"
sigma = "σ_t = 직전 20개 r(오늘 제외) 표본 표준편차 — base-rate@1 과 같은 정의"
event = "|r_t| ≥ 2σ_t. 같은 종목은 h 봉 쿨다운(겹치는 라벨 0)"
news_kr = "그 종목 관련 제목(v_kr_news_title_export · 관련 종목 ≤ 2개 — news-reaction@2 news_max_codes) 중 published_at 이 (전 거래일 15:30, 그날 15:30] KST"
news_crypto = "그 심볼 제목(forecast.news_item — 업비트 원화 일봉 있는 심볼만) 중 published_at 이 그 하루 창(09:00 ~ 다음 날 09:00 KST) 안"
news_exclude = "news-reaction@2 exclude(가격 움직임을 전하는 제목 — '급등' · '특징주' 등)에 걸리는 제목은 세지 않는다 — 움직임 자체를 전하는 기사는 원인 소식이 아니다"
volume = "거래대금 ≥ 직전 20일 평균 × 2 → high, 아니면 normal"
label = "s = sign(r_t) · (ln C_{t+h}/C_t − 같은 날 같은 시장 유니버스 동일가중 평균). 진입 = 그날 종가(근사를 리포트에)"
cost = "검정은 비용 전 s. 리포트에 base-rate@1 왕복 비용 뒤 값을 같이(화면 문구는 비용 뒤)"
n_eff = "날짜 군집 — 날짜별 평균 s 를 먼저 내고 날짜 수준에서 t(Newey–West 시차 h). 서로 다른 날 ≥ 30 · 사건 ≥ 100 이 아니면 그 칸 below_min"
coverage = "소식 원천 덮임 — 그날 그 종목이 속한 원천이 하루 0건이면(수집 멈춤) 그날 사건 제외. 덮인 종목(최근 30일 소식 ≥ 3건)만으로 한 번 더(견고성 — 판정은 주 표본)"
placebo = "소식 날짜를 같은 종목 안에서 ±20 봉 무작위로 옮긴 표본 200회 — 실제 차이가 플라시보 95% 분위 밖이어야 한다"
baseline = "움직임만의 기저율(소식 무시 · 같은 정의 s) — 소식 정보가 그 위에 더하는지를 본다"
cells = "시장(kr · crypto) × 지평(1 · 5) = 4칸 × 검정 3(있음 > 0 · 없음 < 0 · 차이 > 0) = 12"

[decision]
pass = "칸 × 검정마다 단측 p 가 그날 Holm(12, α = alpha_per_look) 통과 + 플라시보 통과 + 덮인 종목 견고성에서 부호가 같다"
display = "통과한 칸 · 검정만 패널 '오늘 왜 움직였나' 아래 한 줄('소식이 있던 큰 움직임 뒤엔 보통 이어졌어요 — 100번 중 n번'). 실패 · 판정 전엔 base-rate@1 K1 · K2 · C 류 과거 실제 결과만"
fail = "마지막 판정 날짜에 통과 못 하면 그 검정 fail(사유 = below_min > no_effect > placebo > coverage)"
apply = "문턱(2σ · 2배) · 소식 창 · 제목 거르기 변경 = 새 키. 기사 본문 사실(FC-REQ-028 FR-10)이 들어오면 '소식 종류별'은 move-news@2"

[forward]
predict = "매일 시험 작업이 마감된 봉에서 사건 · 소식 유무 · 거래량을 기록한다(라벨 닫히기 전 기록 — available_at = 이 등록 커밋 뒤만 판정 표본)"
sample = "이 키로 기록한 사건 중 라벨이 닫힌 것"

[looks]
dates = ["2027-01-12", "2027-02-11", "2027-03-13"]   # 등록 뒤 60 · 90 · 120일
alpha_per_look = 0.0166667
family = "한 날짜 안 Holm — 그날 판정하는 칸 × 검정"
min_days = 30
