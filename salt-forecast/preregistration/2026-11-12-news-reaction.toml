id = "analyst_report"
text = "증권사 리포트"
markets = ["kr"]
include = ["리포트 브리핑", "목표가", "목표주가"]
exclude = []
# 맨 앞 — 리포트 제목은 실적 낱말을 자주 담는다(그건 실적 공시가 아니라 의견이다)

