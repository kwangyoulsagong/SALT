[protocol]
origin = "kr: kind = disclosure(공시) | news(시황) 를 따로 센다 — 같은 '수주'라도 공시와 기사 제목은 다른 사건이다. crypto: news 하나"
event = "제목 하나 × 관련 종목 하나 → 분류. 같은 (시장, 출처, 종류, 종목, 기준 봉)은 사건 하나(여러 매체 같은 날 기사 = 한 번)"
cooldown = "같은 (시장, 출처, 종류, 종목)은 앞 사건 기준 봉에서 5봉 안이면 세지 않는다(겹치는 라벨로 표본을 부풀리지 않는다)"
ref_bar = "기준 봉 = available_at <= 게시 시각 인 마지막 일봉(domain/events.reaction 그대로). 장중 기사는 기준이 전 거래일 종가라 기사 전 장중 움직임이 1봉 반응에 섞인다 — 근사를 리포트에 적는다"
excess = "초과 반응 h = ln(C_{ref+h}/C_ref) − ln(M_{ref+h}/M_ref). M = 시장 대용 — 국내 KR-EW(domain/kr_market_proxy, kr-universe@1 구성 · 시점 고정) · 코인 업비트 원화 동일가중(그날 봉이 있고 전날 봉이 있는 종목의 로그수익 평균을 누적)"
pre_move = "선반영 = ln(C_ref/C_{ref−5}) − ln(M_ref/M_{ref−5})"
kr_breaks = "국내 원천 끊김(domain/kr_breaks)을 걸친 창은 None — 라벨 · 선반영 둘 다"
horizons = [1, 5]
baseline = "평소 p₀ = 같은 시장 · 같은 지평에서 (종목, 봉) 전부의 초과 반응 > 0 비율. 국내 = 그 봉에 kr-universe@1 을 통과한 종목, 코인 = 그날 봉이 있는 종목 전부. as_of 에 창이 닫힌 봉만"
as_of = "통계는 as_of 에 h 봉이 닫힌 사건만(available_at <= as_of). 평소도 같다"
n_eff = "같은 날 몰림 보정 — base-rate@1 과 같은 날짜 군집 ICC · 설계 효과(domain/base_rate.effective_n). 군집 키 = 기준 봉 날"
min_sample = "유효 n ≥ 30 그리고 서로 다른 날 ≥ 20 — 못 넘으면 status = below_min, 비율 · 평균 · 분위 null(표본 수는 낸다)"
stats = "오른 비율(초과 > 0) · 95% Wilson(유효 n) · 평균 · q10 · q50 · q90 · 선반영 중앙값"
differs = "원비율 vs p₀ 양측 z(유효 n) → 시장 × 지평마다 (출처, 종류) 가족 Holm α 0.05. 통과 + 부호 = higher | lower, 못 넘음 = null(엇갈림)"

[decision]
label = "서버가 숫자만 옮긴다: status = below_min → few('같은 종류 n건뿐') · ok + higher → up_usually('보통 올랐던 소식') · ok + lower → down_usually('보통 내렸던 소식') · ok + null → mixed('반응 엇갈림')"
label_horizon = "칩 문구는 1봉 지평으로 정한다. 5봉은 펼침에 숫자로만"
not_a_signal = "태그는 서술이다 — 판단 엔진 · 점검 · 확률의 입력이 아니다(이 등록으로 그 규칙들을 바꾸지 않는다)"
apply = "사전 · 지평 · 문턱 변경 = 새 키. 매일 배치가 같은 키로 다시 계산한다(표본이 자라는 것은 같은 등록)"

[report]
selection = "국내 = 원천이 준 관련 종목(iscd1~10) 중 kis 일봉이 있는 종목. 코인 = 심볼 태깅 중 업비트 일봉이 있는 것. 폐지 종목도 봉이 남은 만큼 들어간다"
known_limits = "국내 제목 원천은 2025-11 ~ (1년 백필). 매분 수집 전(2026-11-06 전)은 백필 쪽만 — 같은 초 40건 넘침은 놓친다. 코인 뉴스는 2025-12 ~ 이고 심볼 태깅이 거칠다"
