# 사전등록 — 소식 측정 태그: 사건 종류 · 같은 종류 과거 반응 · 선반영 (F017 v2 단계 6 · FC-REQ-028 FR-3 · ADR-009 개정 11-10)
#
# 이 파일은 **반응 숫자를 한 번도 계산하기 전에** 커밋한다. 사전(키워드) · 지평 · 문턱 · 기준을 바꾸려면 새 키(`news-reaction@2`).
# 사전을 지을 때 본 것은 제목 표본(2026-11-06 ~ 11-12, 반응 숫자 없음)뿐이다 — 반응을 보고 키워드를 고르면 서술이 아니라 주장이 된다.
#
# 왜: 소식 행에 "보통 올랐던 소식 · 보통 내렸던 소식 · 반응 엇갈림"을 붙인다(사용자 선택 "측정 문구"). 호재 · 악재 단어는 0 —
# 의견이 아니라 채점되는 숫자다. 분류는 규칙 사전(LLM 0). LLM 이 주가 영향을 고르면 전문가와 52% 일치(리서치 2026-11-10-ai-coach-scenario §3).

key = "news-reaction@1"
registered = 2026-11-12

[question]
text = """
같은 사건 종류의 소식이 나온 뒤 그 종목은 시장보다 더 올랐나(초과 반응 > 0 의 비율) — 1 · 5 거래일(코인 1 · 5일).
'평소'(같은 시장 · 같은 지평의 모든 종목 · 모든 날 초과 반응 > 0 비율)와 다르다고 말하는 것은 Holm 보정 뒤에만.
선반영 = 소식 전 5봉 초과 수익(그 종목 · 그 소식 기준 봉까지).
"""

[sources]
kr = "public.v_kr_news_title_export(시장 market 주인 — 시황 · 공시 제목 + 관련 종목). 게시 시각 = available_at(원천이 준 게시 시각 — 받은 시각 아님). 2026-11-12 서버가 1년 백필(BackfillKrNewsTitles)"
crypto = "public.v_news_article_export(news 주인 — 코인 뉴스 제목 + 심볼). 심볼은 원천 태깅이라 잡음이 있다(BIT · KBS 같은 대문자 낱말) — 업비트 원화 일봉이 있는 심볼만 남긴다"
kr_bars = "forecast.price_bar kis 1d(수정주가). available_at = 그 거래일 16:00 KST"
crypto_bars = "forecast.price_bar upbit 1d. available_at = 다음 날 09:00 KST"

[classify]
# 분류 = 제목에 include 중 하나가 들고 exclude 는 하나도 없으면 그 종류. 위에서부터 첫 맞음. 대소문자 무시(소문자로 비교) · 부분 문자열(정규식 아님 —
# 파이썬 · 서버가 같은 결과를 내야 한다. 공용 사례 표 contracts/news-kind/cases.json 을 양쪽 테스트가 읽는다)
# 서버는 이 사전을 forecast.v_news_kind_rule 로만 읽는다 — 사전이 두 곳에 적히지 않는다
# 시장마다 먼저 거르는 낱말 — 가격 움직임을 전하는 제목(이미 일어난 반응) · 파생 상품 안내 · 예고 · 해제/해지
exclude_kr = ["가격제한폭", "괴리율", "상장지수", "etf", "etn", "예고", "해제", "해지", "특징주", "상승세", "하락세", "급등", "급락", "상한가", "하한가", "강세", "약세", "소폭"]
exclude_crypto = ["특징주", "급등", "급락", "상승세", "하락세", "강세", "약세", "시황"]
news_max_codes = 2   # 뉴스(국내 시황 · 코인) 제목은 관련 종목 2개 이하만 — 업종 묶음 기사는 그 종목의 소식이 아니다. 공시는 늘 한 종목
unknown = "other — 태그 행은 내되 반응 숫자는 0(종류 칩만 '기타'로도 내지 않는다: 화면은 태그 없이 행만)"

