# 사전등록 — 단타 방향 확률 v2: 비교 기준 · 플라시보만 바꿈 (F017 v2 단계 5 · FC-REQ-028 FR-1 · FR-4)
#
# 이 파일은 @2 전체 실행보다 먼저 커밋한다. 바꾸려면 새 키(`short-direction@3`).
#
# ── 왜 @2 인가 — @1 의 결함 두 겹(2026-11-11 진단, 리포트 short-direction-short-direction-1-2026-11-11.md) ──
# ① 기준이 둔했다. @1 은 BSS 를 '학습 창 365일 오른 비율(기후값)' 대비로 쟀는데, 모델은 직전 60일 OOS 로 Beta 보정을 한다.
#    그래서 피처가 아무것도 몰라도 '요즘 분위기'(최근 오른 비율)만으로 기후값을 이긴다.
#    진단(코인 1시간, 백필 중 데이터 · 판정 무관): 피처 없는 같은 보정 모델 vs 기후값 BSS +0.0022 [+0.0012, +0.0036].
# ② 셔플이 샜다. '날짜 안 라벨 셔플'은 1시간 격자에서 같은 날 앞 시간 라벨을 뒤 행에 놓는데, 뒤 행 피처(직전 4 · 24시간 · 그날 수익)가
#    그 구간 수익을 담는다. 진단: 날짜 안 셔플 라벨에서도 피처 몫 +0.0012 [+0.0006, +0.0017].
# 피처 누수는 없었다: 라벨을 종목마다 8~30일 통째로 미룬 플라시보에서 피처 몫 CI 가 0 을 포함(seed 셋: +0.00005 · +0.00003 · +0.00015).
#
# 바꾸는 것 둘 — 이유는 위 구조이고, "통과하는 쪽"을 고른 것이 아니다:
#   (a) 비교 기준 = **피처 없는 같은 모델**(같은 오프셋 · 같은 walk-forward · 같은 Beta 보정). BSS 는 '피처가 더한 몫'만 잰다
#   (b) 플라시보 = **종목마다 라벨을 k 일 통째로 미룸**, k ∈ [8, 30](가장 긴 피처 창 σ 168시간 = 7일 + 지평 최대 1일보다 길어 라벨 창이
#       어떤 피처 창과도 겹치지 않는다). 국내 일 격자는 k 거래일. 같은 기준(피처 없는 모델, 같은 플라시보 라벨)으로 잰 피처 몫 CI 가 0 포함
# 나머지 — 칸 · 원천 · 유니버스 · 피처 7 · 모델 · 창 · 보정 · 비용 · 확신 구간 · 문턱(ECE 0.03 · 확신 300 · 비용 뒤 > 0) · Holm 가족 — @1 그대로.
#
# **표본 재사용**: 같은 기간을 @1 과 진단에서 이미 봤다(피처 몫 점추정 +0.0052 포함). 그래서 @2 '통과'는 **라이브 예측 원장 발행 허가일 뿐**이다.
# 화면 확률(renderable)은 등록 뒤 라이브 예측만으로: 확신 행 ≥ 300 이고 (확신 적중 − 늘 오른다) 95% CI 하한 > 0.
# 그 전까지 카드는 확률 없이 사유 `awaiting_live`(실제 성적이 쌓이는 중) + 과거 검산 성적(출처 라벨).

key = "short-direction@2"
registered = 2026-11-11
supersedes = "short-direction@1"
same_as = "short-direction@1 — [cells] [protocol.*] [features] [model] [walk_forward] · [metrics] 중 ece · reliability · confident · net · bss_persistence"

[metrics]
reference = "피처 없는 모델 — x 를 상수 열 하나(0)로 바꾼 같은 walk_forward(오프셋 logit(b) · Beta 보정 같은 풀 · 같은 문턱). 평가 행 = 두 모델 다 보정된 행"
bss = "BSS = 1 − Brier(p) / Brier(p_ref), p_ref = 피처 없는 모델. CI = 날짜 블록 부트스트랩(@1 과 같은 블록 · 횟수 · seed). 단측 p = 부트스트랩 BSS ≤ 0 비율"
bss_climatology = "기후값 대비 BSS — 리포트만(판정 무관). @1 과 이어 보기 위해"
placebo = """
종목마다 k ~ U{8, …, 30}(종목 이름 정렬 순서로 seed 20261111 정수 추출) — 행 t 라벨 ← 같은 종목 t − k일(코인 24k 행 · 국내 k 행) 라벨, 없으면 라벨 없음.
같은 walk-forward 로 원래 모델 · 피처 없는 모델 둘 다 → 피처 몫 BSS 95% CI 가 0 을 포함해야 한다. 아니면 결과 무효(placebo_failed — 판정 전 원인)
"""

[decision]
pass = """
칸마다 전부: (1) 피처 몫 BSS Holm 통과(단측 p, α 0.05, 가족 = 시험 칸 넷) 그리고 CI 하한 > 0 (2) 직전 방향 대비 BSS > 0 (3) ECE ≤ 0.03
(4) 확신 행 ≥ 300 그리고 (확신 적중 − 늘 오른다) CI 하한 > 0 (5) 확신 '오름' 비용 뒤 평균 > 0 (6) 플라시보 통과
"""
blocked_reasons = "placebo_failed > no_skill(1 · 2) > miscalibrated(3) > no_edge_confident(4) > cost(5). 통과했지만 라이브 미달 = awaiting_live"
display = """
renderable = 칸 통과 그리고 live_ready. live_ready = 이 키 등록 뒤 라이브 예측(채점 끝) 확신 행 ≥ 300 그리고 (확신 적중 − 늘 오른다) 95% CI 하한 > 0.
라이브 숫자와 과거 검산 숫자를 합치지 않는다. 라이브 (적중 − 늘 오른다) CI 상한 < 0 이면 live_underperforms(재점등은 새 키로만)
"""
live = "통과 칸만 매시(국내 거래일 16:00 뒤) 예측을 쓴다(live_ready 와 무관 — 라이브 표본을 쌓아야 하므로). @1 [decision] live 의 분위 · 무효선 그대로"
