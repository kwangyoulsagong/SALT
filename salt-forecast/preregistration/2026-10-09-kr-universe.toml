# 사전등록 — 국내 주식 시점 고정 유니버스 (F011 슬라이스 5c · FC-REQ-020 FR-7)
#
# 이 파일은 **전 종목 일봉 백필 결과를 보기 전에** 커밋한다. 커밋 시각 · 해시가 등록 증거다.
# 등록 뒤 하한 · 창 · 판정 조건을 바꾸려면 새 키(`kr-universe@2`)로 새 파일을 만든다 — 덮어쓰지 않는다.
#
# 배경: P0(2026-10-09) 에서 국내 4기간 모두 풀링 검정 미통과. 표본 = **현재** 시총 상위 51종목(지난 2년 오른 종목)이라
# 위 꼬리 이탈 7~8% · 아래 1~4% 로 기울었다. 위치를 0 으로 고정해도 남았다 → 모델이 아니라 표본 선택의 문제.
# 등록 시점까지 전 종목 일봉으로 계산한 결과 0회(백필이 막 시작됐다).

key = "kr-universe@1"
registered = 2026-10-09
model = "kr-ens-baseline@0.2.0"   # 위치 0 — P0 에서 정한 챔피언, 바꾸지 않는다

[data]
bars = """
서버가 KIS 에서 받은 수정주가 정규장 일봉 public.price_history(kr_stock, 1d) → forecast.price_bar(kis, 1d).
대상 = 지금 상장된 주권(ST) 보통주(우선주 · 상폐 제외) 약 2,450, 5년(또는 상장일부터). available_at = 거래일 16:00 KST.
"""
turnover = "거래대금 ≈ 수정 종가 × 수정 거래량(원). 원천에 거래대금 열이 없다 — 분할 · 병합에도 곱은 거의 보존된다"

[universe]
rule = """
as_of t(주 첫 거래일 09:00 KST)마다 종목 s 가 대상이려면 셋 다:
1. t 에 종가를 아는 최근 KRX 거래일 20일 전부에 s 의 봉이 있다(거래정지 · 무거래 제외)
2. 그 20일 거래대금 평균 ≥ 10억 원
3. t 에 아는 s 의 일봉 ≥ 250개(약 1년 — 상장 60거래일 미만 억제(FR-9)를 덮고, 기준 모델 최소 120 수익률을 넉넉히)
"""
min_turnover_krw = 1_000_000_000
window_sessions = 20
min_bars = 250
why_1e9 = """
개인이 정규장에서 수백만~수천만 원 주문을 거래대금의 0.1% 안팎 충격으로 넣을 수 있는 하한. 이보다 얇은 종목은 일봉이
상 · 하한 · 무거래로 끊기고 구간 전망이 행동 가능한 정보가 아니다. 값은 경험 규칙이다 — 결과를 보고 고르지 않는다.
"""
survivorship = """
**남는 편향**: 유니버스 후보가 지금 상장된 종목뿐이다(상폐 종목 일봉 없음 — FR-8 · SRV-REQ-040 FR-41 대기).
현재 시총 순위로 과거를 고르던 것보다 덜하지만 0 이 아니다. 리포트 머리에 적는다.
"""

[protocol]
gate = "FC-REQ-020 P0 그대로 — 주별 단면 d̄_t, 최근 104주, HLN-DM · 블록 부트스트랩 · 비중첩 셋 다, 4기간 Holm α 0.05"
placebo = "8주 날짜 블록 맞바꾸기 200회 — 거짓 발견 비율(귀무 평균 ÷ 관측) ≤ 20%"
coverage = "매 h번째 주 · 위/아래 꼬리 따로 · 날짜 클러스터 SE — 참고(판정 아님)"

[decision]
pass = "풀링 통과 기간이 있고 플라시보 ≤ 20% 면 그 기간 국내 카드가 켜질 자격(화면은 별 슬라이스 5d)"
fail = "통과 기간이 없으면 카드는 꺼진 채 — P2(척도 · 형태 · 보정) 도전자로 간다. 하한을 바꿔 다시 재지 않는다"
