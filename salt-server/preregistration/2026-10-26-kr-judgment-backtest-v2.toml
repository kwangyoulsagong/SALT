# 사전등록 — 국내 주식 판단 백테스트 표본 @2 (F011 슬라이스 7c · SRV-REQ-040 FR-44)
#
# 이 파일은 @2 를 **한 번도 돌려 보기 전에** 커밋한다. 커밋 시각 · 해시가 등록 증거다.
# @1(`2026-10-26-kr-judgment-backtest.toml`)은 덮어쓰지 않는다 — @1 의 결과 리포트도 그대로 둔다.
#
# 바뀌는 것은 **비용 하나**다. @1 은 비용을 0.0023(2026 거래세 0.20% + 수수료 0.015% × 2)로 전 기간 고정했고
# "연도별 거래세 표는 FR-44 — 이 등록에서 쓰지 않는다"고 적었다. 표본의 매도(만기)는 2022-02 ~ 2026-10 에 걸쳐 있고
# 그동안 거래세는 0.23% → 0.20% → 0.18% → 0.15% → 0.20% 로 움직였다. 2024~25 매도를 0.20% 로 채점하면 후보 · 기저율의
# 경계가 실제보다 높고, 2022 매도는 낮다. 리서치 권고 18: "채점 이력에 2025 매도가 섞이면 연도별 세율 표를 적용해야
# 과거 성과가 정직해진다".
#
# 결과를 보고 고르지 않는다 — 아래 표 · 수수료는 세법 · 공개 수수료에서 정했고 @1 결과와 무관하다.

key = "kr-judgment-backtest@2"
registered = 2026-10-26
supersedes = "kr-judgment-backtest@1"
rule = "@1 과 같다 — mode-decision@2 장기, 운영 코드 `scoreModeDecision` 그대로"

[inputs]
same_as = "kr-judgment-backtest@1 [inputs] 전부"

[universe]
same_as = "kr-judgment-backtest@1 [universe] 전부(kr-universe@1)"

[schedule]
same_as = "kr-judgment-backtest@1 [schedule] 전부(30일 간격 · 해시 오프셋 · 판단일 2022-01-01 ~ · 만기 < 2026-10-08)"

[scoring]
exit = "@1 과 같다(krJudgmentExitWindow)"
breaks = "@1 과 같다(종가 비 1.31 초과 · 0.69 미만 표본 제외)"
evaluated_at = "@1 과 같다(만기일 16:00 KST)"
outcome = "judgeOutcome(long_term, action, r, cost(evaluated_at)) — 후보 r > 비용 · 피하기 r ≤ 비용 · 관망 |r| ≤ 10%(관망은 비용 무관)"
cost = "왕복 = 위탁 수수료 한쪽 × 2 + 매도 거래세(매도일 = evaluated_at 의 KST 날짜가 속한 구간)"
commission_per_side = "0.000186 = 비대면 기본 위탁수수료 0.015% + 유관기관 제비용 약 0.0036%(리서치 '명시 왕복 0.237%'의 기본 쪽). 우대(0.0036% 만, 왕복 0.207%)는 쓰지 않는다 — 보수적 쪽"
always_up = "풀 '항상 오른다' — 표본마다 자기 매도일 비용을 넘겨 오른 몫(한 숫자로 고정하지 않는다)"

# 매도 거래세(코스피 = 증권거래세 + 농어촌특별세 0.15%, 코스닥 = 증권거래세 단일). 두 시장 합계가 같은 구간만 있다.
# 코넥스(0.10%)는 유니버스에 없다(서버 마스터 = 코스피 · 코스닥).
# 세법상 양도 시기와 결제(T+2)의 어긋남 — 연말 마지막 거래일 1~2일 매도분의 세율 차이는 근사로 둔다.
[[sell_tax]]
from = 2021-01-01
rate = 0.0023
[[sell_tax]]
from = 2023-01-01
rate = 0.0020
[[sell_tax]]
from = 2024-01-01
rate = 0.0018
[[sell_tax]]
from = 2025-01-01
rate = 0.0015
[[sell_tax]]
from = 2026-01-01
rate = 0.0020

[implicit_cost]
rule = "스프레드 · 슬리피지(암묵 비용)는 0 — 근거 수치가 없다(리서치 권고 18 '약'). 표본은 종가 대 종가라 암묵 비용을 더하면 그만큼 후보가 불리해진다 — 리포트에 적는다"

[storage]
rerun = "@1 과 같다 — kr_stock 백테스트 행을 지우고 새로 넣는다(한 문장). 라이브 · 코인 행은 건드리지 않는다. @1 행은 남지 않는다(같은 rule_version · sample_origin)"

[display]
same_as = "kr-judgment-backtest@1 [display] 전부 — 라이브 ≥ 20 이면 라이브, 아니면 백테스트(표본 ≥ 20 · 판단 달 ≥ 12), 합산 없음"

[revalidation]
same_as = "@1 [revalidation] 전부(달 블록 부트스트랩 2,000 · 시드 20261026 · 같은 날 라벨 순열 1,000)"
compare = "리포트에 @1 대비 행동별 적중률 · 기저율 · 초과분 차이를 함께 적는다 — 비용 표만 바뀌었으니 차이 = 세율 효과"
