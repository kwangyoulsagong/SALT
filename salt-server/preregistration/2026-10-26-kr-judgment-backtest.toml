# 사전등록 — 국내 주식 판단 백테스트 표본 (F011 슬라이스 7b · SRV-REQ-040 FR-43)
#
# 이 파일은 백테스트를 **한 번도 돌려 보기 전에** 커밋한다. 커밋 시각 · 해시가 등록 증거다.
# 등록 뒤 규칙 · 유니버스 · 창 · 판정 조건을 바꾸려면 새 키(`kr-judgment-backtest@2`)로 새 파일을 만든다 — 덮어쓰지 않는다.
#
# 배경: 국내 주식 판단(`kr_stock.long_term.*`)은 라이브 표본이 0 이다(2026-10-26 — 스냅샷 52 · 채점 0, 첫 채점 2026-11-07 경).
# 종목마다 30일에 1표본이라 "피하기"가 20 표본을 채우려면 몇 달이 걸린다. 그동안 국내 판단은 근거 · 적중률 · 실패사례가 없어
# 렌더되지 않는다. 사용자 결정(2026-10-26): "5년 백테스트 + 라벨 분리" — 같은 규칙을 서버 5년 일봉으로 되돌려 채점해
# `backtest` 표본으로 저장하고, 라이브 표본이 모자랄 동안만 "과거 시세로 되돌려 채점(모의)" 라벨로 보여 준다.
# 라이브와 섞지 않는다(salt-forecast modeling-evaluation §4 와 같은 원칙).

key = "kr-judgment-backtest@1"
registered = 2026-10-26
rule = "mode-decision@2 장기(long_term) — 운영 코드 `scoreModeDecision` 을 그대로 부른다(규칙을 두 곳에 적지 않는다)"

[inputs]
change24h = "판단일 t 종가 ÷ 직전 봉 종가 − 1 (%) — 라이브는 장중 현재가 ÷ 전일 종가. 백테스트는 종가 시점 판단으로 고정"
rsi = "market `calculateIndicators` 의 rsi14 — t 까지 최근 100 일봉(라이브 `RefreshTechnicalIndicators` 창과 같음, 50 봉 미만이면 지표 없음)"
sentiment = "없음(국내 주식엔 심리 · 대량 체결 재료가 없다 — 라이브와 같음)"
missing_data = "가격 · 일봉 지표가 있으면 0개"
history = "t 까지 일봉 ≥ 120 (라이브 KR_MIN_DAILY_BARS 와 같음)"

[universe]
rule = "kr-universe@1 (salt-forecast 2026-10-09 등록과 같은 규칙) — t 에 그 종목 봉이 있고, 시장 최근 20 거래일 전부에 봉이 있고, 20일 평균(종가 × 거래량) ≥ 10억 원, t 까지 봉 ≥ 250"
sessions = "거래일 = 국내 일봉이 있는 날짜의 합집합(종목 무관)"
note = "현재 시총 상위 · 관심 종목으로 과거를 고르지 않는다(생존 편향). 상장폐지 종목은 서버 일봉에 없다 — 리포트에 적는다(FR-41 보류)"

[schedule]
spacing = "종목마다 앞 판단 + 30일(달력) 이후 첫 거래일 — 라이브 스냅샷 간격(B39)과 같다"
start = "종목마다 창 시작일 + (종목 코드 해시 mod 30)일 이후 첫 거래일 — 모든 종목이 같은 날 판단하지 않게"
window = "판단일 2022-01-01 ~, 만기(t + 30일)가 2026-10-08(라이브 첫 스냅샷) 이전이고 서버 마지막 일봉 이하인 판단만"
judged_at = "t 의 16:00 KST(종가 확정 시각)"

[scoring]
exit = "krJudgmentExitWindow — 만기일 이전(포함) 마지막 거래일 종가, 10일 안에 봉이 없으면 표본 없음"
outcome = "judgeOutcome(long_term, action, r, 0.0023) — 후보 r > 비용 · 피하기 r ≤ 비용 · 관망 |r| ≤ 10%"
cost = "0.0023 전 기간 고정(env 기본). 연도별 거래세 표는 FR-44 — 이 등록에서 쓰지 않는다(2021~22 실제 비용이 더 높고 2024~25 는 낮다)"
evaluated_at = "만기일 종가 확정 시각(16:00 KST) — 성적 문구의 기간이 실행 시각이 아니라 과거 기간을 말하게"
breaks = "진입 전 100봉 ~ 만기 봉 사이에 종가 ÷ 전 봉 종가가 1.31 초과 또는 0.69 미만인 날이 있으면 그 표본을 뺀다(미수정 병합 · 분할 — 실데이터에서 ×0.05 같은 점프 확인). 예측 kr_breaks 는 위만 끊지만, 판단 수익률은 30일 단순 수익률이라 아래 점프 하나가 표본을 망친다. 정리매매 하락도 같이 빠진다 — 리포트에 뺀 수를 적는다"

[storage]
table = "public.symbol_judgment_snapshots — sample_origin 'backtest', rule_version 'mode-decision@2', signal_type 'kr_stock.long_term.<action>'"
rerun = "다시 돌리면 kr_stock 백테스트 행을 지우고 새로 넣는다(한 문장). 라이브 · 코인 행은 건드리지 않는다"

[display]
rule = """
국내 주식 판단 유형마다: 라이브 표본 ≥ 20 이면 라이브만. 아니면 백테스트 표본 ≥ 20 이고 판단 달(月) ≥ 12 이면 백테스트만 —
응답에 `sampleOrigin: backtest` 와 기간을 싣고 화면은 "과거 시세로 되돌려 채점한 모의 성적 · 실제와 다를 수 있음" 라벨.
둘을 합산하지 않는다. 코인은 지금 그대로(라이브만). 성적표(스코어보드)는 라이브만 그대로.
"""
gate = "나머지 게이트(근거 문장 · 실패사례 · 신선도 · 이력)는 그대로 — 근거 문장 없는 관망은 여전히 막힌다"

[revalidation]
# FR-43 "국내 채점 풀에서 재검증". 판정이 아니라 **보고**다 — 결과로 위 display 규칙을 바꾸지 않는다(바꾸려면 @2)
per_action = "적중률 · 기저율(같은 표본 '항상 오른다' 비율로 만든 naiveHitRate) · 초과 적중률 · 평균 수익률 · 최악 · 표본 · 판단 달 수"
ci = "초과 적중률 95% — 판단 달 단위 블록 부트스트랩 2,000회(시드 고정 20261026)"
placebo = "같은 판단일 안에서 종목끼리 행동 라벨을 맞바꾸는 순열 1,000회 — 초과 적중률의 귀무 분포 · 단측 p"
expectation = "장기 점수의 최대는 64 라 '모아가기 후보'(≥ 70)는 나오지 않는다 — 관망 · 피하기 두 그룹만 생길 것"
