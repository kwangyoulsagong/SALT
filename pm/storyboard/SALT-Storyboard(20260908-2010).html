<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>SALT 투자코치 스토리보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    /* ── grey 10단계 ── */
    --g50:#f9fafb; --g100:#f2f4f6; --g200:#e5e8eb; --g300:#d1d6db; --g400:#b0b8c1;
    --g500:#8b95a1; --g600:#6b7684; --g700:#4e5968; --g800:#333d4b; --g900:#191f28;
    /* ── blue 10단계 ── */
    --b50:#e8f3ff; --b100:#c9e2ff; --b200:#90c2ff; --b300:#64a8ff; --b400:#4593fc;
    --b500:#3182f6; --b600:#2272eb; --b700:#1b64da; --b800:#1957c2; --b900:#194aa6;
    /* ── red 10단계 ── */
    --r50:#ffeeee; --r100:#ffd4d6; --r200:#feafb4; --r300:#fb8890; --r400:#f66570;
    --r500:#f04452; --r600:#e42939; --r700:#d22030; --r800:#bc1b2a; --r900:#a51926;
    /* ── 의미 토큰 ── */
    /* 브랜드(액센트) = 우리 값 유지 #7949FF — 하락 청색과 충돌 방지 (FE-REQ-005 D-1) */
    --br500:#7949FF; --br600:#6339E6; --br700:#5329CC; --br300:#9B7FFF; --br50:#E5DBFF;
    --blue:var(--br500); --blue-dk:var(--br700); --blue-lt:var(--br50); --blue-100:#D6C7FF;
    /* 시세 = 우리 값 유지 */
    --up:#FF2E55; --down:#1677EE;
    /* LLM 생성물 전용 (FE-REQ-005 FR-9 후보) */
    --ai:#20C997; --ai-lt:#C3FAE8;
    /* radius — 버튼 크기별 (FE-REQ-005 D-7) */
    --rd-btn-sm:8px; --rd-btn-md:10px; --rd-btn-lg:14px; --rd-btn-xl:16px;
    --red:var(--up); --red-lt:var(--r50);
    --green:#00a06d; --green-lt:#e8f8f2;
    --amber:#f59e0b; --amber-lt:#fff7e6; --violet:#8b5cf6; --violet-lt:#f3eeff;
    --ink:var(--g900); --ink-2:var(--g800); --ink-3:var(--g700); --ink-4:var(--g500); --ink-5:var(--g400);
    --line:var(--g200); --line-2:var(--g100); --bg:var(--g100); --white:#fff;
    /* ── elevation ── */
    --shadow-s:0 1px 2px rgba(25,31,40,.04),0 2px 8px rgba(25,31,40,.04);
    --shadow-m:0 4px 16px rgba(25,31,40,.08);
    --shadow-l:0 18px 50px rgba(25,31,40,.18);
    /* ── radius ── */
    --rd-s:8px; --rd-m:12px; --rd-l:16px; --rd-xl:20px;
    --rail:250px;
    --font:'Inter','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;
  }
  /* ── 타입 스케일 7단계 (size / line-height) ── */
  .t1{font-size:30px;line-height:40px;letter-spacing:-.03em}
  .t2{font-size:26px;line-height:35px;letter-spacing:-.028em}
  .t3{font-size:22px;line-height:31px;letter-spacing:-.024em}
  .t4{font-size:20px;line-height:29px;letter-spacing:-.02em}
  .t5{font-size:17px;line-height:25.5px;letter-spacing:-.014em}
  .t6{font-size:15px;line-height:22.5px;letter-spacing:-.01em}
  .t7{font-size:13px;line-height:19.5px;letter-spacing:-.006em}
  .t8{font-size:11px;line-height:16.5px}
  .w4{font-weight:400} .w5{font-weight:500} .w6{font-weight:600} .w7{font-weight:700}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
  .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  button{font-family:inherit}

  /* ============ SHELL ============ */
  .app{display:flex;height:100vh;overflow:hidden}
  .rail{width:var(--rail);flex:0 0 var(--rail);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
  .rail-brand{padding:18px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-2)}
  .rail-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--blue-dk));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
  .rail-name{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .rail-sub{font-size:11px;color:var(--ink-4);font-weight:600}
  .rail-scroll{flex:1;overflow-y:auto;padding:12px 10px 8px}
  .nav-sec{font-size:10.5px;font-weight:800;color:var(--ink-5);letter-spacing:.06em;padding:12px 10px 6px;text-transform:uppercase}
  .nav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2);line-height:1.3}
  .nav-item:hover{background:var(--line-2)}
  .nav-item.on{background:var(--blue-lt);color:var(--blue-dk);font-weight:700}
  .nav-ic{width:22px;height:22px;flex:0 0 22px;border-radius:7px;display:grid;place-items:center;font-size:12px;background:var(--line-2);color:var(--ink-3)}
  .nav-item.on .nav-ic{background:var(--blue);color:#fff}
  .nav-tag{margin-left:auto;font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px;background:var(--line-2);color:var(--ink-4)}
  .nav-tag.new{background:var(--blue-lt);color:var(--blue-dk)}
  .nav-tag.cut{background:var(--red-lt);color:var(--red)}
  .rail-foot{border-top:1px solid var(--line-2);padding:10px;display:grid;gap:7px}
  .rf-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
  .rf-btn:hover{background:var(--line-2)}
  .rf-btn.on{background:var(--amber-lt);border-color:#FCD9A0;color:#92400E}
  .rf-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-5)}
  .rf-btn.on .rf-dot{background:var(--amber)}

  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:60px;flex:0 0 60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px}
  .tb-title{font-size:16px;font-weight:800;letter-spacing:-.01em}
  .tb-sub{font-size:12px;color:var(--ink-4);font-weight:600}
  .tb-spacer{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:7px;background:var(--line-2);color:var(--ink-3)}
  .chip.b{background:var(--blue-lt);color:var(--blue-dk)}
  .chip.g{background:var(--green-lt);color:var(--green)}
  .chip.r{background:var(--red-lt);color:var(--red)}
  .chip.a{background:var(--amber-lt);color:#92400E}
  .stage{flex:1;overflow-y:auto;padding:26px 30px 60px}
  .stage-in{display:flex;gap:30px;align-items:flex-start;max-width:1320px;margin:0 auto}

  /* ============ INTENT NOTE ============ */
  .intent{display:none;max-width:1320px;margin:0 auto 22px;background:#FFFBEB;border:1px solid #FCD9A0;border-left:4px solid var(--amber);border-radius:12px;padding:14px 18px}
  body.notes .intent{display:block}
  .intent h4{margin:0 0 6px;font-size:12.5px;font-weight:800;color:#92400E;display:flex;align-items:center;gap:7px}
  .intent p{margin:0;font-size:13px;color:#78350F;line-height:1.7}
  .intent .src{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;color:#92400E;background:#FEF3C7;padding:2px 7px;border-radius:5px}

  /* ============ PHONE ============ */
  .phone-wrap{flex:0 0 auto;position:sticky;top:0}
  .phone{width:392px;height:812px;background:#fff;border-radius:44px;box-shadow:var(--shadow-l);border:9px solid #111827;overflow:hidden;position:relative;display:flex;flex-direction:column}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:130px;height:26px;background:#111827;border-radius:0 0 16px 16px;z-index:9}
  .p-status{flex:0 0 42px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 5px;font-size:11.5px;font-weight:700;color:var(--ink)}
  .p-body{flex:1;overflow-y:auto;background:var(--bg);padding:0 0 8px}
  .p-body::-webkit-scrollbar{width:0}
  .p-tabbar{flex:0 0 64px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 4px 6px}
  .p-tab{flex:1;display:grid;place-items:center;gap:3px;padding:8px 0 0;border:none;background:none;cursor:pointer}
  .p-tab .ti{font-size:17px;line-height:1;filter:grayscale(1);opacity:.45}
  .p-tab .tl{font-size:10px;font-weight:700;color:var(--ink-5)}
  .p-tab.on .ti{filter:none;opacity:1}
  .p-tab.on .tl{color:var(--blue)}
  .p-head{background:#fff;padding:14px 20px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line-2)}
  .p-head .h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
  .p-head .back{font-size:19px;color:var(--ink-2);font-weight:700}

  /* ============ TOSS CARDS ============ */
  .sec{padding:0 16px;margin-top:12px}
  .card{background:#fff;border-radius:var(--rd-xl);padding:20px;box-shadow:var(--shadow-s);position:relative}
  .card+.card{margin-top:12px}
  .card.tap{cursor:pointer}
  .card.tap:active{background:#FAFBFC}
  .c-label{font-size:12.5px;font-weight:700;color:var(--ink-4);display:flex;align-items:center;gap:6px}
  .c-big{font-size:31px;font-weight:800;letter-spacing:-.035em;margin-top:5px;line-height:1.15}
  .c-mid{font-size:22px;font-weight:800;letter-spacing:-.03em}
  .c-delta{font-size:13.5px;font-weight:700;margin-top:3px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-4)}
  .c-arrow{position:absolute;right:18px;top:20px;color:var(--ink-5);font-size:15px;font-weight:700}
  .divider{height:1px;background:var(--line-2);margin:15px -20px 15px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .row+.row{margin-top:11px}
  .rl{font-size:13.5px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;gap:7px}
  .rv{font-size:14px;font-weight:700;letter-spacing:-.01em}
  .sub{font-size:11.5px;color:var(--ink-4);font-weight:600;line-height:1.6}
  .tiny{font-size:11px;color:var(--ink-5);font-weight:600}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--line-2);color:var(--ink-3)}
  .pill.b{background:var(--blue-lt);color:var(--blue-dk)} .pill.r{background:var(--red-lt);color:var(--red)}
  .pill.g{background:var(--green-lt);color:var(--green)} .pill.a{background:var(--amber-lt);color:#92400E}
  .pill.v{background:var(--ai-lt);color:#0E7C63}
  .btn{display:block;width:100%;height:52px;padding:0 20px;border-radius:var(--rd-btn-lg);border:none;background:var(--blue);color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:14px}
  .btn.ghost{background:var(--line-2);color:var(--ink-2)}
  .btn.sm{height:42px;padding:0 14px;font-size:14px;border-radius:var(--rd-btn-md);margin-top:10px}
  .bar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .avat{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 34px}
  .a-btc{background:#FFF4E5;color:#F7931A} .a-eth{background:#EEF0FF;color:#627EEA}
  .a-us{background:var(--blue-lt);color:var(--blue-dk)} .a-kr{background:var(--red-lt);color:var(--red)}
  .banner{border-radius:14px;padding:13px 15px;font-size:12.5px;font-weight:600;line-height:1.6}
  .banner.a{background:var(--amber-lt);color:#92400E} .banner.r{background:var(--red-lt);color:#B3261E}
  .banner.b{background:var(--blue-lt);color:var(--blue-dk)} .banner.n{background:var(--line-2);color:var(--ink-3)}
  .disc{padding:16px 20px 22px;font-size:10.5px;color:var(--ink-5);line-height:1.7}
  .hscroll{display:flex;gap:9px;overflow-x:auto;padding:0 16px 2px;margin-top:12px}
  .hscroll::-webkit-scrollbar{height:0}
  .dchip{flex:0 0 auto;background:#fff;border-radius:15px;padding:13px 15px;box-shadow:var(--shadow-s);min-width:126px}
  table.mini{width:100%;border-collapse:collapse;font-size:12px}
  table.mini th{text-align:right;font-size:10.5px;color:var(--ink-4);font-weight:700;padding:0 0 8px}
  table.mini th:first-child{text-align:left}
  table.mini td{text-align:right;padding:8px 0;border-top:1px solid var(--line-2);font-weight:700;font-size:12.5px}
  table.mini td:first-child{text-align:left;font-weight:600;color:var(--ink-3)}
  .scen{display:grid;grid-template-columns:1fr;gap:9px;margin-top:13px}
  .scen>div{border:1px solid var(--line);border-radius:14px;padding:13px 15px}
  .scen .st{font-size:11.5px;font-weight:800;color:var(--ink-4)}
  .scen .sv{font-size:18px;font-weight:800;letter-spacing:-.02em;margin-top:3px}
  .slider{-webkit-appearance:none;width:100%;height:5px;border-radius:99px;background:linear-gradient(90deg,var(--blue) 52%,var(--line) 52%);margin:14px 0 4px}
  .slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.22);border:1px solid var(--line)}
  details.acc{border-top:1px solid var(--line-2);padding-top:12px;margin-top:12px}
  details.acc summary{font-size:12.5px;font-weight:700;color:var(--blue-dk);cursor:pointer;list-style:none}
  details.acc summary::-webkit-details-marker{display:none}
  details.acc .ac{font-size:12px;color:var(--ink-3);line-height:1.75;margin-top:9px;font-weight:600}
  .spark{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:12px}
  .spark i{flex:1;border-radius:2px 2px 0 0;background:var(--blue-100)}
  .lg{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
  .lg span{font-size:11px;font-weight:700;color:var(--ink-3);display:flex;align-items:center;gap:5px}
  .lg i{width:14px;height:3px;border-radius:2px;display:block}

  /* screen marker badges */
  .mk{position:absolute;width:21px;height:21px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 7px rgba(49,130,246,.5);z-index:8}
  body:not(.notes) .mk{display:none}

  /* ============ ANNOTATIONS ============ */
  .notes-col{flex:1;min-width:340px}
  .nc-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .nc-head h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .ncard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow-s)}
  .ncard+.ncard{margin-top:9px}
  .ncard .nh{display:flex;align-items:flex-start;gap:10px}
  .nnum{width:21px;height:21px;flex:0 0 21px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;margin-top:1px}
  .ncard .nt{font-size:13.5px;font-weight:800;letter-spacing:-.01em}
  .ncard .nd{font-size:12.5px;color:var(--ink-3);line-height:1.75;margin-top:6px;font-weight:500}
  .ncard .nmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .ncard code{background:var(--line-2);padding:1px 5px;border-radius:4px;font-size:11px;color:var(--ink-2)}
  .grp-h{font-size:11px;font-weight:800;color:var(--ink-5);letter-spacing:.05em;margin:18px 0 8px;text-transform:uppercase}

  /* ============ DOC MODAL ============ */
  .ov{position:fixed;inset:0;z-index:100;display:none;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);overflow-y:auto;padding:34px 20px 70px}
  .ov.open{display:block}
  .ov-close{position:fixed;top:24px;right:28px;z-index:101;width:38px;height:38px;border-radius:11px;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:16px;font-weight:800;cursor:pointer;display:none;place-items:center}
  .ov.open .ov-close{display:grid}
  .doc{max-width:1080px;margin:0 auto;background:var(--bg);border-radius:20px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.4)}
  .doc-in{padding:0 26px 40px}
  .cover{background:linear-gradient(135deg,#0F2B5B 0%,#123A7A 52%,#0B1E42 100%);color:#fff;padding:38px 40px;margin:0 -26px;position:relative;overflow:hidden}
  .cover::after{content:'';position:absolute;right:-90px;top:-90px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(49,130,246,.5),transparent 70%)}
  .cbadge{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;background:rgba(255,255,255,.14);padding:6px 12px;border-radius:99px;letter-spacing:.04em;position:relative}
  .cover h1{font-size:31px;font-weight:800;letter-spacing:-.025em;margin:16px 0 8px;line-height:1.16;position:relative}
  .cover .lead{font-size:14.5px;color:#B8CBE8;max-width:680px;position:relative;line-height:1.75}
  .cmeta{display:flex;gap:26px;margin-top:24px;flex-wrap:wrap;position:relative}
  .cmeta .k{font-size:10.5px;color:#7F9BC7;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
  .cmeta .v{font-size:13.5px;font-weight:700;margin-top:3px}
  .schip{display:inline-flex;align-items:center;gap:6px;background:rgba(252,211,77,.18);color:#FCD34D;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:800}
  .dsec{margin-top:30px}
  .dst{font-size:18px;font-weight:800;letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
  .dst .n{width:25px;height:25px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:800}
  .dsd{color:var(--ink-3);font-size:13.5px;margin:9px 0 16px;max-width:860px;line-height:1.75}
  .htbox{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-s);padding:6px 4px}
  .htbox ul{margin:0;padding:10px 24px;display:grid;gap:10px}
  .htbox li{font-size:13.5px;color:var(--ink-3);line-height:1.7}
  .htbox li b{color:var(--ink)}
  .kbd{display:inline-block;background:var(--line-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:800;color:var(--ink-2)}
  table.dt{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-s);font-size:13px}
  table.dt th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-4);font-weight:800;padding:11px 14px;background:#FAFBFC;border-bottom:1px solid var(--line)}
  table.dt td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:top;line-height:1.6}
  table.dt tr:last-child td{border-bottom:none}
  table.dt td.g{font-weight:800;color:var(--blue-dk);white-space:nowrap}
  table.dt td.s{font-weight:700}
  table.dt td.c{color:var(--ink-3);font-size:12.5px}
  .vd{font-size:11px;font-weight:800;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .vd.keep{background:var(--green-lt);color:var(--green)}
  .vd.cut{background:var(--red-lt);color:var(--red)}
  .vd.new{background:var(--blue-lt);color:var(--blue-dk)}

  ${disc}`,
  notes:[
    {n:1,t:'D-Day 칩 3개',d:'미국주식은 <b>결제일 기준</b>이라 "12/30 매도 → 12/31 결제"가 2026년 귀속 마지막이고 증권사 처리 차이 때문에 <b>12/29 권고</b>. 크립토는 양도일 기준 12/31. 국내주식은 "비과세" 고정.',meta:['FEATURE-002 FR-1','FR-2']},
    {n:2,t:'미국주식 — 손실 수확',d:'실현차익 → 기본공제 → 과세표준 → 예상세금. 그 아래 <b>"평가손실 N종목을 연내 실현하면 세금 0원"</b>. 통산에 들어가는 손실은 <b>실현한 손실만</b>이다 — 안 팔면 그해 계산에 안 들어온다.',meta:['FEATURE-002 FR-10','FR-13']},

    {n:4,t:'크립토 · 국내주식 · 증빙',d:'크립토는 연내 매도(세금 0) vs 연말 스텝업 중 어느 쪽이 유리한지 손익분기점으로 답한다. 국내주식은 "계산 대상 아님"을 명확히 해서 인지 부하를 줄인다. 증빙은 2027년 신고를 위해 자동 보관한다.',meta:['FR-20~FR-25','FR-30~FR-32','FR-5']},

  extra:[

    {t:'법령 리스크 대응',d:'시행일·세율·기준일이 전부 설정값이다. 국회에서 재유예되면 시행일만 바꿔 D-Day와 모든 계산이 재산정된다. 법령 상태는 <b>자동 크롤링하지 않고</b> 사용자가 수동 갱신한다 — 잘못된 "폐지됐습니다" 표시가 계산 오류보다 위험하다.',meta:['FEATURE-002 FR-3','정책']},

  ]

taxUs:{ tab:'tax', title:'미국주식 손실 수확 솔버', sub:'FEATURE-002 FR-13 · 250만원 공제에 정확히 맞추기', drill:true,
  chips:[['g','절세 576,400원'],['r','12/29 마감']],
  intent:'예: 올해 실현차익 500만원이면 세금 55만원. 평가손실 300만원 종목을 <b>연내 결제까지</b> 실현하면 통산 후 200만원 → 250만원 공제 안 → <b>세금 0원</b>. 솔버는 이 조합을 자동으로 찾는다. 후보를 3개(최소 매도금액 / 최소 종목 수 / 공제를 정확히 채우는 조합) 내고 <b>어느 것도 추천하지 않는다</b>. 부분 매도 수량까지 산출하되, 판단은 사용자가 한다.',
  src:'FEATURE-002 FR-13~FR-16 · 수용기준 "목표값 ±1원"',
  body:()=>`
  ${head('손실 수확',1)}

    <div class="card" style="border:1px solid var(--blue-100)">
      <div class="row"><div class="c-label" style="color:var(--blue-dk)">후보 A · 공제를 정확히 채우는 조합</div><span class="pill b">권장 배지 없음</span></div>

    </div>

    </div>

    {n:2,t:'솔버 후보 3개',d:'각 종목의 <b>부분 매도 수량</b>까지 산출한다. 계산은 달러 손익이 아니라 <b>환율 환산 후 원화 손익</b> 기준. 보유 수량을 초과하지 않고, 마감 이후 결제되는 종목은 제외한다. <b>추천 배지 없음</b>이 명시적 정책이다.',meta:['FR-13','FR-14','FR-15']},
    {n:3,t:'계산 전제 전면 노출',d:'세율·공제·귀속기준·환율·통산범위·신고기한을 화면에 그대로 둔다. 세무 조언이 아니라 계산기라는 포지셔닝의 실체가 이 카드다.',meta:['FEATURE-002 FR-4','정책']},
  ]
},

taxCrypto:{ tab:'tax', title:'크립토 — 연내 매도 vs 연말 스텝업', sub:'FEATURE-002 FR-20~FR-25 · 1회성 이벤트', drill:true,

function renderNav(){
  document.getElementById('nav').innerHTML = NAV.map(g=>`
    <div class="nav-sec">${g.sec}</div>
    ${g.items.map(i=>`<button class="nav-item ${i.id===cur?'on':''}" onclick="go('${i.id}')">
      <span class="nav-ic">${i.ic}</span><span>${i.label}</span>
      ${i.tag?`<span class="nav-tag ${i.tag==='신규'?'new':i.tag==='제거'?'cut':''}">${i.tag}</span>`:''}
    </button>`).join('')}
  `).join('');
}
function render(){
  const s = SCREENS[cur];
  document.getElementById('tbTitle').textContent = s.title;
  document.getElementById('tbSub').textContent = s.sub;
  document.getElementById('tbChips').innerHTML = (s.chips||[]).map(c=>`<span class="chip ${c[0]}">${c[1]}</span>`).join(' ');
  document.getElementById('intent').innerHTML = `<h4>💡 기획 의도</h4><p>${s.intent}</p>${s.src?`<span class="src">근거: ${s.src}</span>`:''}`;

  const wrap = document.querySelector('.phone-wrap');
  const nc = document.querySelector('.notes-col');
  if(s.wide){
    wrap.style.display='none';
    nc.style.minWidth='0';
    document.getElementById('ncTitle').textContent = '기능 판정 보드';
    document.getElementById('ncCount').textContent = `${INV.length}개 항목`;
    document.getElementById('notes').innerHTML = s.render();
  } else {
    wrap.style.display='';
    nc.style.minWidth='340px';
    document.getElementById('pbody').innerHTML = s.body();
    document.getElementById('ptab').innerHTML = TABS.map(t=>`
      <button class="p-tab ${t.id===s.tab?'on':''}" onclick="go('${t.id}')">
        <span class="ti">${t.ic}</span><span class="tl">${t.l}</span></button>`).join('');
    document.getElementById('ncTitle').textContent = '화면 구성';
    document.getElementById('ncCount').textContent = `${(s.notes||[]).length}개 블록`;
    document.getElementById('notes').innerHTML =
      (s.notes||[]).map(n=>`<div class="ncard"><div class="nh"><span class="nnum">${n.n}</span>
        <div><div class="nt">${n.t}</div><div class="nd">${n.d}</div>
        ${n.meta?`<div class="nmeta">${n.meta.map(m=>`<span class="pill b">${m}</span>`).join('')}</div>`:''}</div></div></div>`).join('')
      + ((s.extra&&s.extra.length)?`<div class="grp-h">설계 결정 · 제약</div>`+s.extra.map(n=>`
        <div class="ncard"><div class="nh"><span class="nnum" style="background:var(--ink-3)">·</span>
          <div><div class="nt">${n.t}</div><div class="nd">${n.d}</div>
          ${n.meta?`<div class="nmeta">${n.meta.map(m=>`<span class="pill">${m}</span>`).join('')}</div>`:''}</div></div></div>`).join(''):'');
  }
  wrapTables();
  document.querySelector('.stage').scrollTop = 0;
}
function wrapTables(){
  document.querySelectorAll('table.dt').forEach(t=>{
    if(t.parentNode && t.parentNode.classList && t.parentNode.classList.contains('tblwrap')) return;
    const w=document.createElement('div'); w.className='tblwrap';
    t.parentNode.insertBefore(w,t); w.appendChild(t);
  });
}
function go(id){ if(!SCREENS[id])return; cur=id; renderNav(); render(); }
function toggleNotes(){
  notesOn=!notesOn;
  document.body.classList.toggle('notes',notesOn);
  document.getElementById('noteBtn').classList.toggle('on',notesOn);
  document.getElementById('noteLbl').textContent = notesOn?'기획 의도 끄기':'기획 의도 보기';
}

function closeDoc(){ document.getElementById('ov').classList.remove('open'); }

function wireClicks(root){
  if(!root || root.__wired) return;
  root.__wired = true;
  root.addEventListener('click', (e)=>{
    let el = e.target;
    while(el && el !== root){
      if(el.dataset && el.dataset.go){ go(el.dataset.go); e.stopPropagation(); return; }
      if(el.getAttribute && el.getAttribute('onclick')) return;   // 이미 배선된 요소

    }

    const t = FALLBACK[cur]; if(t) go(t);

  const pts = [[0,.80],[6.6,.74],[13.3,.82],[20,.66],[26.6,.70],[33.3,.58],[40,.63],[46.6,.48],
               [53.3,.54],[60,.42],[66.6,.46],[73.3,.36],[80,.41],[86.6,.31],[93.3,.35],[100,.24]];
  const P = pts.map(p=>`${p[0]/100*w},${p[1]*h}`).join(' ');
  const A = `${P} ${w},${h} 0,${h}`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block" preserveAspectRatio="none">
    <defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(240,68,82,.16)"/><stop offset="100%" stop-color="rgba(240,68,82,0)"/></linearGradient></defs>
    <line x1="0" y1="${h*.565}" x2="${w}" y2="${h*.565}" stroke="#3182f6" stroke-width="1" stroke-dasharray="4 4" opacity=".65"/>
    <line x1="0" y1="${h*.78}"  x2="${w}" y2="${h*.78}"  stroke="#1b64da" stroke-width="1" stroke-dasharray="4 4" opacity=".65"/>
    <line x1="0" y1="${h*.30}"  x2="${w}" y2="${h*.30}"  stroke="#f04452" stroke-width="1" stroke-dasharray="4 4" opacity=".55"/>
    <polygon points="${A}" fill="url(#dg)"/>
    <polyline points="${P}" fill="none" stroke="#f04452" stroke-width="2.2"/>
  </svg>`;
};
